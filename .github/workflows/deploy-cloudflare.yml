name: Deploy Edgeforce to Cloudflare

on:
  workflow_run:
    workflows: ["Verify Edgeforce"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: edgeforce-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'de9b84b39940a0b5b622ae5d27b415dc' }}
      EDGEFORCE_DATABASE_URL: ${{ secrets.EDGEFORCE_DATABASE_URL || secrets.DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_XlvGJkid1lgNPLVGPJn1ScEr
      VERCEL_PROJECT_ID: prj_CJokQ1ngz20Rwb7eNjk9gf3HjFHo
      VERCEL_PRODUCTION_ALIAS: edgeforce-ai.vercel.app
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require both exact-main certification workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ATTEMPT in {1..60}; do
            curl --fail --silent --show-error               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&head_sha=$DEPLOY_COMMIT&per_page=100"               --output /tmp/exact-main-runs.json
            EDGE=$(jq '[.workflow_runs[]? | select(.name=="Verify Edgeforce" and .status=="completed" and .conclusion=="success")] | length' /tmp/exact-main-runs.json)
            CF=$(jq '[.workflow_runs[]? | select(.name=="Verify Edgeforce Cloudflare" and .status=="completed" and .conclusion=="success")] | length' /tmp/exact-main-runs.json)
            if [ "$EDGE" -gt 0 ] && [ "$CF" -gt 0 ]; then
              echo "Exact-main certification complete for $DEPLOY_COMMIT."
              exit 0
            fi
            echo "Waiting for exact-main certification ($ATTEMPT/60): Verify Edgeforce=$EDGE, Cloudflare=$CF"
            sleep 5
          done
          echo "Exact-main certification did not converge for $DEPLOY_COMMIT."
          exit 1

      - name: Verify required deployment prerequisites
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$EDGEFORCE_DATABASE_URL" ] || missing+=("EDGEFORCE_DATABASE_URL or DATABASE_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Cloudflare production prerequisites: %s\n' "${missing[*]}"
            exit 1
          fi

      - run: npm install
      - run: npm run preflight:cloudflare
      - run: npm run typecheck
      - run: npm run check:vinext
      - name: Generate Edgeforce runtime secrets
        shell: bash
        run: |
          INGEST_SECRET=$(openssl rand -hex 32)
          CRON_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INGEST_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

      - name: Build Cloudflare Worker
        shell: bash
        run: |
          set -o pipefail
          npm run build:vinext 2>&1 | tee /tmp/edgeforce-vinext-build.log
      - name: Stamp Cloudflare deployment commit
        run: node scripts/stamp-cloudflare-deployment.mjs

      - name: Upload Cloudflare build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeforce-v119-cloudflare-build-${{ github.sha }}
          path: /tmp/edgeforce-vinext-build.log
          if-no-files-found: warn
      - run: npm run validate:cloudflare-build

      - name: Reject a superseded production commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_COMMIT"

      - name: Apply Neon/Postgres migrations through current release
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.EDGEFORCE_DATABASE_URL || secrets.DATABASE_URL }}

      - name: Prepare atomic Cloudflare runtime secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.EDGEFORCE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          umask 077
          SECRET_DIR=$(mktemp -d "$RUNNER_TEMP/edgeforce-runtime.XXXXXX")
          echo "EDGEFORCE_RUNTIME_SECRET_DIR=$SECRET_DIR" >> "$GITHUB_ENV"
          node scripts/cloudflare-runtime-secrets.mjs "$SECRET_DIR/secrets.json"

      - name: Deploy Cloudflare Worker with production secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy --config dist/server/wrangler.json --secrets-file "${{ env.EDGEFORCE_RUNTIME_SECRET_DIR }}/secrets.json"

      - name: Remove private Cloudflare runtime secrets
        if: always() && env.EDGEFORCE_RUNTIME_SECRET_DIR != ''
        shell: bash
        run: |
          rm -f "$EDGEFORCE_RUNTIME_SECRET_DIR/secrets.json"
          rmdir "$EDGEFORCE_RUNTIME_SECRET_DIR"

      - name: Wait for exact Worker release identity
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          test -n "$DEPLOYMENT_URL"
          for i in {1..30}; do
            set +e
            HEALTH=$(curl --silent --show-error "$DEPLOYMENT_URL/api/health")
            CODE=$?
            set -e
            if [ "$CODE" -eq 0 ] && printf '%s' "$HEALTH" | jq -e \
              --arg version "119.0.0" \
              --arg model "edgeforce-v119" \
              --arg commit "$DEPLOY_COMMIT" \
              '.version==$version and .modelVersion==$model and .deploymentCommit==$commit and .releaseIdentityMatch==true' >/dev/null 2>&1; then
              echo "$HEALTH"
              exit 0
            fi
            echo "Waiting for exact V119 Worker identity (attempt $i/30)"
            sleep 3
          done
          echo "Cloudflare Worker never converged to the exact V119 release identity."
          exit 1

      - name: Certify recommendation data without blocking platform launch
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          HTTP_CODE=000
          CURL_CODE=1
          for ATTEMPT in {1..10}; do
            set +e
            HTTP_CODE=$(curl --silent --show-error -o /tmp/provider-certification.json -w "%{http_code}" \
              -X POST "$DEPLOYMENT_URL/api/providers/certify" \
              -H "Authorization: Bearer $INGEST_SECRET" \
              -H "Content-Type: application/json")
            CURL_CODE=$?
            set -e
            if [ "$CURL_CODE" -eq 0 ] && { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "422" ]; }; then
              break
            fi
            if [ "$CURL_CODE" -eq 0 ] && [ "$HTTP_CODE" = "401" ] && [ "$ATTEMPT" -lt 10 ]; then
              echo "Waiting for rotated Cloudflare ingest secret propagation (attempt $ATTEMPT/10)."
              sleep 2
              continue
            fi
            break
          done
          cat /tmp/provider-certification.json || true
          echo
          if [ "$CURL_CODE" -ne 0 ]; then
            exit "$CURL_CODE"
          fi
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "422" ]; then
            echo "Provider certification returned unexpected HTTP $HTTP_CODE"
            exit 1
          fi
          LAUNCH_READY=$(jq -r '.launchReady // false' /tmp/provider-certification.json 2>/dev/null || echo false)
          {
            echo "### Recommendation data certification"
            echo "- Recommendation-ready: **$LAUNCH_READY**"
            echo "- Platform deployment remains independent of temporary sportsbook quota exhaustion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Observe live sportsbook continuity without blocking platform launch
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set +e
          HTTP_CODE=$(curl --silent --show-error -o /tmp/live-data-status.json -w "%{http_code}" \
            "$DEPLOYMENT_URL/api/live-data/status?maxStoredAgeMin=90")
          CURL_CODE=$?
          set -e
          cat /tmp/live-data-status.json || true
          echo
          if [ "$CURL_CODE" -ne 0 ]; then
            echo "Live-data status request failed; platform smoke tests still determine release health."
          fi
          USABLE=$(jq -r '.usable // false' /tmp/live-data-status.json 2>/dev/null || echo false)
          SOURCE=$(jq -r '.source // "unavailable"' /tmp/live-data-status.json 2>/dev/null || echo unavailable)
          {
            echo "### Sportsbook continuity"
            echo "- HTTP status: **$HTTP_CODE**"
            echo "- Usable real market data: **$USABLE**"
            echo "- Effective source: **$SOURCE**"
            echo "- Recommendation routes remain fail-closed when usable market data is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify cross-venue prediction terminal
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/prediction-terminal?trades=50&markets=50" > /tmp/prediction-terminal.json
          node -e "const d=require('/tmp/prediction-terminal.json'); if(d.scope!=='ALL_PREDICTION_MARKETS'||d.analyticsOnly!==true) process.exit(1); console.log(JSON.stringify({scope:d.scope,contracts:d.summary?.contracts||0,recentTrades:d.summary?.recentTrades||0}))"

      - name: Verify iPhone PWA surfaces
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error "$DEPLOYMENT_URL/mobile" > /dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/predictions" > /dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/manifest.webmanifest" > /dev/null

      - name: Prime prediction intelligence warehouse
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set +e
          HTTP_CODE=$(curl --silent --show-error -o /tmp/prediction-warehouse.json -w "%{http_code}" \
            "$DEPLOYMENT_URL/api/cron/predictions" \
            -H "Authorization: Bearer $INGEST_SECRET")
          CURL_CODE=$?
          set -e
          cat /tmp/prediction-warehouse.json || true
          echo
          if [ "$CURL_CODE" -ne 0 ]; then
            exit "$CURL_CODE"
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Prediction warehouse prime returned HTTP $HTTP_CODE"
            exit 1
          fi
          node -e "const d=require('/tmp/prediction-warehouse.json'); const p=d.executionProfile||{}; if(d.ok!==true||d.scope!=='ALL_PREDICTION_MARKETS'||p.cloudflareBounded!==true||Number(p.contractLimit)>300||Number(p.tradeLimit)>100) process.exit(1); console.log(JSON.stringify({degraded:Boolean(d.degraded),executionProfile:p,contracts:d.fetched?.contracts||0,trades:(d.fetched?.kalshiTrades||0)+(d.fetched?.polymarketTrades||0),warehouse:d.warehouse,warnings:d.warnings||[]}))"

      - name: Strict Cloudflare platform launch doctor
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          PASSES=0
          for ATTEMPT in 1 2 3; do
            HTTP_CODE=$(curl --silent --show-error --output /tmp/launch-doctor.json --write-out "%{http_code}" "$DEPLOYMENT_URL/api/launch-doctor?strict=1&platform=1" || echo 000)
            cat /tmp/launch-doctor.json || true
            READY=$(jq -r '.platformReady // .ready // false' /tmp/launch-doctor.json 2>/dev/null || echo false)
            VERSION=$(jq -r '.version // ""' /tmp/launch-doctor.json 2>/dev/null || echo "")
            if [ "$HTTP_CODE" = "200" ] && [ "$READY" = "true" ] && [ "$VERSION" = "119.0.0" ]; then
              PASSES=$((PASSES+1))
            fi
            if [ "$PASSES" -ge 2 ]; then break; fi
            if [ "$ATTEMPT" -lt 3 ]; then sleep 5; fi
          done
          test "$PASSES" -ge 2

      - name: Hosted V119 smoke test
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_APP_VERSION: "119.0.0"

      - name: Verify Vercel manual standby without deploying
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v4/aliases/$VERCEL_PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID"             --output /tmp/vercel-standby-alias.json
          STANDBY_ID=$(jq -r '.deploymentId // .deployment.id // empty' /tmp/vercel-standby-alias.json)
          test -n "$STANDBY_ID"

          curl --fail --silent --show-error --connect-timeout 10 --max-time 30             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v13/deployments/$STANDBY_ID?teamId=$VERCEL_ORG_ID"             --output /tmp/vercel-standby-deployment.json
          STANDBY_STATE=$(jq -r '.readyState // .state // empty' /tmp/vercel-standby-deployment.json)
          STANDBY_URL=$(jq -r '.url // empty' /tmp/vercel-standby-deployment.json)
          STANDBY_SHA=$(jq -r '.meta.githubCommitSha // .meta.githubCommit // .meta.vercelGitCommitSha // empty' /tmp/vercel-standby-deployment.json)
          test "$STANDBY_STATE" = "READY"
          if [ -z "$STANDBY_URL" ]; then STANDBY_URL="$VERCEL_PRODUCTION_ALIAS"; fi
          case "$STANDBY_URL" in https://*) ;; *) STANDBY_URL="https://$STANDBY_URL" ;; esac

          set +e
          STANDBY_HEALTH_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 30             --output /tmp/vercel-standby-health.json --write-out "%{http_code}"             "https://$VERCEL_PRODUCTION_ALIAS/api/health")
          CURL_CODE=$?
          set -e
          if [ "$CURL_CODE" -ne 0 ] || [ "$STANDBY_HEALTH_CODE" != "200" ]; then
            echo "Vercel standby health check failed."
            exit 1
          fi
          jq -e '.ok==true' /tmp/vercel-standby-health.json >/dev/null

          jq -cn             --arg deploymentUrl "$STANDBY_URL"             --arg deploymentId "$STANDBY_ID"             --arg commitSha "$STANDBY_SHA"             --arg state "$STANDBY_STATE"             --argjson healthStatus "$STANDBY_HEALTH_CODE"             '{deploymentUrl:$deploymentUrl,deploymentId:$deploymentId,commitSha:$commitSha,state:$state,healthy:true,manualOnly:true,healthStatus:$healthStatus}'             > /tmp/vercel-standby-evidence.json

          {
            echo "### Vercel disaster-recovery standby"
            echo "- Deployment: **$STANDBY_ID**"
            echo "- State: **$STANDBY_STATE**"
            echo "- Health: **HTTP $STANDBY_HEALTH_CODE**"
            echo "- Commit: **${STANDBY_SHA:-unknown}**"
            if [ -n "$STANDBY_SHA" ] && [ "$STANDBY_SHA" != "$DEPLOY_COMMIT" ]; then
              echo "- Commit drift: **expected for manual standby**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Cloudflare primary + Vercel standby topology evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          HEALTH=$(curl --fail --silent --show-error "$DEPLOYMENT_URL/api/health")
          BODY=$(jq -cn             --arg deploymentUrl "$DEPLOYMENT_URL"             --arg workflowRunId "$GITHUB_RUN_ID"             --argjson runtime "$HEALTH"             --argjson standby "$(cat /tmp/vercel-standby-evidence.json)"             '{platform:"cloudflare",deploymentUrl:$deploymentUrl,version:$runtime.version,
              modelVersion:$runtime.modelVersion,migrationVersion:$runtime.migrationVersion,
              commitSha:$runtime.deploymentCommit,workflowRunId:$workflowRunId,source:"production-cloudflare",
              topology:"cloudflare-primary-vercel-standby",standby:$standby,
              exactMainCertified:true,hostedSmokePassed:true,platformReady:true}')
          set +e
          HTTP_CODE=$(curl --silent --show-error --output /tmp/topology-evidence-response.json --write-out "%{http_code}" -X POST "$DEPLOYMENT_URL/api/release/platform-convergence"             -H "Authorization: Bearer $INGEST_SECRET"             -H "Content-Type: application/json"             --data "$BODY")
          CURL_CODE=$?
          set -e
          cat /tmp/topology-evidence-response.json || true
          echo
          if [ "$CURL_CODE" -ne 0 ]; then
            echo "Topology evidence transport failed with curl exit $CURL_CODE."
            exit "$CURL_CODE"
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Topology evidence rejected with HTTP $HTTP_CODE."
            jq -r '.report.blockers[]? | "BLOCKER: " + .' /tmp/topology-evidence-response.json || true
            exit 1
          fi
          jq -e '.ok==true and .report.certified==true and (.report.blockers|length)==0' /tmp/topology-evidence-response.json >/dev/null

      - name: Attempt final production closure
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          HEALTH=$(curl --fail --silent --show-error "$DEPLOYMENT_URL/api/health")
          BODY=$(jq -cn --arg commitSha "$(echo "$HEALTH" | jq -r '.deploymentCommit // empty')" --arg workflowRunId "$GITHUB_RUN_ID"             '{commitSha:$commitSha,workflowRunId:$workflowRunId,source:"production-cloudflare"}')
          curl --fail --silent --show-error -X POST "$DEPLOYMENT_URL/api/release/final-closure"             -H "Authorization: Bearer $INGEST_SECRET"             -H "Content-Type: application/json"             --data "$BODY"
          echo

      - name: Publish deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "## Cloudflare Deploy Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Primary platform: Cloudflare Workers (free tier)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel role: manual disaster-recovery standby" >> "$GITHUB_STEP_SUMMARY"
          echo "- Closure policy: Cloudflare current + Vercel standby healthy; standby commit drift is allowed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime release: V119" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model: edgeforce-v119" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migration: current release manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recommendation readiness: reported separately from platform readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prediction intelligence warehouse: primed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prediction terminal: /predictions" >> "$GITHUB_STEP_SUMMARY"
          echo "- iPhone PWA: /mobile" >> "$GITHUB_STEP_SUMMARY"
