name: Edgeforce Cloudflare Hosted Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.number }}
      WORKER_NAME: edgeforce-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Cloudflare preview auth mode
        id: auth
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "mode=permanent" >> "$GITHUB_OUTPUT"
          else
            echo "mode=temporary" >> "$GITHUB_OUTPUT"
          fi

      - run: npm install
      - run: npm run preflight:cloudflare
      - run: npm run typecheck
      - run: npm run check:vinext

      - name: Build exact preview artifact
        shell: bash
        run: |
          set -o pipefail
          npm run build:vinext 2>&1 | tee /tmp/edgeforce-preview-build.log

      - run: npm run validate:cloudflare-build

      - name: Create Cloudflare Preview from certified artifact
        id: preview
        shell: bash
        env:
          PREVIEW_AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          if [ "$PREVIEW_AUTH_MODE" = "permanent" ]; then
            npm run preview:cloudflare -- \
              --name "$PREVIEW_NAME" \
              --tag "${GITHUB_SHA:0:12}" \
              --message "Edgeforce PR #${{ github.event.number }} ${GITHUB_SHA}" \
              --json > /tmp/cloudflare-preview.json
            URL=$(node scripts/extract-cloudflare-preview-url.mjs /tmp/cloudflare-preview.json)
          else
            unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            node scripts/prepare-cloudflare-temporary-preview.mjs
            npx wrangler deploy --temporary --config dist/server/wrangler.temporary.json > /tmp/cloudflare-temporary-preview.txt 2>&1
            URL=$(node scripts/extract-cloudflare-preview-url.mjs /tmp/cloudflare-temporary-preview.txt)
          fi
          test -n "$URL"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "preview_auth_mode=$PREVIEW_AUTH_MODE" >> "$GITHUB_OUTPUT"

      - name: Smoke hosted Cloudflare Preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_APP_VERSION: "102.0.0"
        run: node scripts/cloudflare-preview-smoke.mjs

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeforce-v102-cloudflare-preview-${{ github.sha }}
          path: |
            /tmp/edgeforce-preview-build.log
            /tmp/cloudflare-preview.json
          if-no-files-found: warn

      - name: Publish hosted preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          echo "## Cloudflare Hosted Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: dist/server/wrangler.json -> index.js" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth mode: ${{ steps.preview.outputs.preview_auth_mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Isolation: named Wrangler Preview when authenticated; auto-expiring temporary Worker otherwise" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.number }}
      WORKER_NAME: edgeforce-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Detect permanent preview credentials
        id: auth
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          else
            echo "permanent=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete permanent Cloudflare Preview
        if: steps.auth.outputs.permanent == 'true'
        run: npm run preview:cloudflare:delete -- --name "$PREVIEW_NAME"
