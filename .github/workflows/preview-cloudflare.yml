name: Edgeforce Cloudflare Hosted Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.number }}
      WORKER_NAME: edgeforce-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare preview credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm install
      - run: npm run preflight:cloudflare
      - run: npm run typecheck
      - run: npm run check:vinext

      - name: Build exact preview artifact
        shell: bash
        run: |
          set -o pipefail
          npm run build:vinext 2>&1 | tee /tmp/edgeforce-preview-build.log

      - run: npm run validate:cloudflare-build

      - name: Create Cloudflare Preview from certified artifact
        id: preview
        shell: bash
        run: |
          npx wrangler preview             --config dist/server/wrangler.json             --worker-name "$WORKER_NAME"             --name "$PREVIEW_NAME"             --tag "${GITHUB_SHA:0:12}"             --message "Edgeforce PR #${{ github.event.number }} ${GITHUB_SHA}"             --ignore-base-config             --json > /tmp/cloudflare-preview.json
          cat /tmp/cloudflare-preview.json
          URL=$(node scripts/extract-cloudflare-preview-url.mjs /tmp/cloudflare-preview.json)
          test -n "$URL"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke hosted Cloudflare Preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          EXPECTED_APP_VERSION: "102.0.0"
        run: node scripts/cloudflare-preview-smoke.mjs

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeforce-v102-cloudflare-preview-${{ github.sha }}
          path: |
            /tmp/edgeforce-preview-build.log
            /tmp/cloudflare-preview.json
          if-no-files-found: warn

      - name: Publish hosted preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          echo "## Cloudflare Hosted Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: dist/server/wrangler.json -> index.js" >> "$GITHUB_STEP_SUMMARY"
          echo "- Isolation: Wrangler Preview pr-${{ github.event.number }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.number }}
      WORKER_NAME: edgeforce-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Delete Cloudflare Preview
        run: npx wrangler preview delete --worker-name "$WORKER_NAME" --name "$PREVIEW_NAME" --skip-confirmation
