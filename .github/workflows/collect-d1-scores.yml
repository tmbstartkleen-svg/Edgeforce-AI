name: Collect isolated D1 sports scores
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: edgeforce-isolated-score-collection
  cancel-in-progress: false
jobs:
  score-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      D1_PILOT_CRON_SECRET: ${{ secrets.D1_PILOT_CRON_SECRET }}
    steps:
      - name: Collect bounded source-verified score snapshots
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$D1_PILOT_CRON_SECRET" ]; then
            echo "::error::D1_PILOT_CRON_SECRET is required"
            exit 1
          fi
          echo "::add-mask::$D1_PILOT_CRON_SECRET"
          BASE='https://edgeforce-d1-pilot.tmbstartkleen.workers.dev'
          for sport in nfl ncaaf nba ncaab wnba mlb nhl soccer-epl; do
            status=$(curl -sS --retry 2 --connect-timeout 5 --max-time 20 \
              -o /tmp/edgeforce-score.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" \
              "$BASE/api/operations/d1-pilot/collect-scores?sport=$sport")
            if [ "$status" != '200' ] || ! jq -e '.ok == true' /tmp/edgeforce-score.json >/dev/null; then
              echo "::error::Score-only source $sport failed (HTTP $status)"
              exit 1
            fi
            jq -r --arg sport "$sport" '"- " + $sport + ": fetched=" + (.fetchedEvents|tostring) + " attempted=" + (.attempted|tostring) + " accepted=" + (.accepted|tostring) + " rejected=" + (.rejected|tostring)' /tmp/edgeforce-score.json >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'Only score observations were collected; sportsbook prices and historical table migration are not certified.' >> "$GITHUB_STEP_SUMMARY"
