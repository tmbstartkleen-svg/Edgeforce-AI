name: Inspect EdgeForce migration source schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDGEFORCE_MIGRATION_SOURCE_URL: ${{ secrets.EDGEFORCE_MIGRATION_SOURCE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate separately scoped migration credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EDGEFORCE_MIGRATION_SOURCE_URL" ]; then
            echo "::error::EDGEFORCE_MIGRATION_SOURCE_URL is missing. Add a read-only PostgreSQL connection string as a GitHub Actions secret; do not reuse production credentials."
            exit 1
          fi
          echo "::add-mask::$EDGEFORCE_MIGRATION_SOURCE_URL"
      - run: npm ci
      - name: Inspect source schema using read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d1-pg-source-schema-preflight.mjs > /tmp/edgeforce-source-schema-report.json
          jq -e '.ok==true and .productionWrites==false and .d1Writes==false and .cutoverAuthorized==false' /tmp/edgeforce-source-schema-report.json
          echo 'Read-only source PostgreSQL schema compatible with D1 baseline export contract.' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.tables[] | "- \(.table): \(.columns) columns, compatible=\(.compatible)"' /tmp/edgeforce-source-schema-report.json >> "$GITHUB_STEP_SUMMARY"
