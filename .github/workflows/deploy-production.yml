name: Edgeforce Production Deploy

on:
  workflow_run:
    workflows: ["Verify Edgeforce"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_XlvGJkid1lgNPLVGPJn1ScEr
      VERCEL_PROJECT_ID: prj_8edFTZzS8e6RZyMVm1mjxuGJnLPZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.1.0

      - name: Generate deployment-only secrets
        shell: bash
        run: |
          INGEST_SECRET=$(openssl rand -hex 32)
          CRON_SECRET=$(openssl rand -hex 32)
          DEPLOY_BOOTSTRAP_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INGEST_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$DEPLOY_BOOTSTRAP_SECRET"
          echo "INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          echo "DEPLOY_BOOTSTRAP_SECRET=$DEPLOY_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          args=(
            --prebuilt
            --prod
            --yes
            --token="$VERCEL_TOKEN"
            --env MODEL_VERSION=edgeforce-v46
            --env DEFAULT_BANKROLL=1000
            --env INGEST_SECRET="$INGEST_SECRET"
            --env CRON_SECRET="$CRON_SECRET"
            --env DEPLOY_BOOTSTRAP_SECRET="$DEPLOY_BOOTSTRAP_SECRET"
            --env TARGET_BOOKMAKER=DraftKings
            --env ALLOW_DEMO_DATA=false
            --env THE_ODDS_API_MAX_SPORTS=12
            --env THE_ODDS_API_CACHE_MS=120000
            --env THE_ODDS_API_CREDIT_RESERVE=25
          )
          if [ -n "$THE_ODDS_API_KEY" ]; then
            args+=(--env THE_ODDS_API_KEY="$THE_ODDS_API_KEY")
          fi
          URL=$(vercel deploy "${args[@]}")
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for deployed runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error "$PRODUCTION_URL/api/health/live" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Apply database migrations inside Vercel runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/release/bootstrap" \
            -H "Authorization: Bearer $DEPLOY_BOOTSTRAP_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Certify live production providers
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/providers/certify" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Require strict launch doctor
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: curl --fail --silent --show-error "$PRODUCTION_URL/api/launch-doctor?strict=1"

      - name: Smoke test production deployment
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.production_url }}
          EXPECTED_APP_VERSION: "46.0.0"

      - name: Record production release attestation
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/release/attest" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"production-prebuilt","buildPassed":true,"smokePassed":true,"loadPassed":true}'
          echo

      - name: Certify final production release
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/release/certify?strict=1" \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Roll back production on hosted failure
        if: failure() && steps.deploy.outcome == 'success'
        run: vercel rollback --yes --token="$VERCEL_TOKEN"
