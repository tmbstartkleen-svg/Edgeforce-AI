name: Edgeforce Production Deploy

on:
  workflow_run:
    workflows: ["Verify Edgeforce"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_SCOPE: tmbstartkleen-4716s-projects
      VERCEL_PROJECT_NAME: edgeforce-ai
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
      ML_SERVICE_BASE_URL: ${{ secrets.RENDER_ML_SERVICE_BASE_URL }}
      ML_SERVICE_KEY: ${{ secrets.ML_SERVICE_KEY }}
      ML_ACTIVATION_SECRET: ${{ secrets.ML_ACTIVATION_SECRET }}
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Compile ML service
        run: python3 -m py_compile ml-service/app.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.2.0

      - name: Generate deployment-only secrets
        shell: bash
        run: |
          INGEST_SECRET=$(openssl rand -hex 32)
          CRON_SECRET=$(openssl rand -hex 32)
          DEPLOY_BOOTSTRAP_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INGEST_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$DEPLOY_BOOTSTRAP_SECRET"
          echo "INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          echo "DEPLOY_BOOTSTRAP_SECRET=$DEPLOY_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"
          LAUNCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${DEPLOY_COMMIT:0:12}"
          echo "LAUNCH_ID=$LAUNCH_ID" >> "$GITHUB_ENV"

      - name: Start predeploy verification server
        run: |
          MODEL_VERSION=edgeforce-v119 ENABLE_TEST_ENDPOINTS=true NEXT_TELEMETRY_DISABLED=1 npm start > /tmp/edgeforce-predeploy.log 2>&1 &
          echo $! > /tmp/edgeforce-predeploy.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/edgeforce-predeploy.log
          exit 1

      - name: Predeploy local smoke
        run: npm run smoke
        env:
          ENABLE_TEST_ENDPOINTS: "true"

      - name: Predeploy local load check
        run: npm run load-check
        env:
          LOAD_REQUESTS: "60"
          LOAD_MAX_P95_MS: "3000"

      - name: Stop predeploy verification server
        if: always()
        run: kill $(cat /tmp/edgeforce-predeploy.pid) 2>/dev/null || true

      - name: Verify Vercel team authorization
        shell: bash
        run: |
          set +e
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" project inspect "$VERCEL_PROJECT_NAME" >/tmp/edgeforce-vercel-project.txt 2>/tmp/edgeforce-vercel-project.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cat /tmp/edgeforce-vercel-project.err
            echo "VERCEL_TOKEN is not authorized to inspect project '$VERCEL_PROJECT_NAME' under scope '$VERCEL_SCOPE'. Reissue or reconnect the token for this team scope."
            exit 1
          fi

      - name: Resolve live Vercel project mapping
        shell: bash
        run: |
          rm -rf .vercel
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" link --yes --project="$VERCEL_PROJECT_NAME"
          test -f .vercel/project.json
          RESOLVED_PROJECT_ID=$(jq -r '.projectId // empty' .vercel/project.json)
          RESOLVED_ORG_ID=$(jq -r '.orgId // empty' .vercel/project.json)
          test -n "$RESOLVED_PROJECT_ID"
          test -n "$RESOLVED_ORG_ID"
          echo "VERCEL_PROJECT_ID=$RESOLVED_PROJECT_ID" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$RESOLVED_ORG_ID" >> "$GITHUB_ENV"

      - name: Pull production project settings
        run: vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" pull --yes --environment=production

      - name: Capture previous production deployment
        shell: bash
        run: |
          PREVIOUS_DEPLOYMENT_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1&teamId=$VERCEL_ORG_ID")
          PREVIOUS_DEPLOYMENT_ID=$(printf '%s' "$PREVIOUS_DEPLOYMENT_JSON" | jq -r '.deployments[0].uid // .deployments[0].id // empty')
          PREVIOUS_DEPLOYMENT_URL=$(printf '%s' "$PREVIOUS_DEPLOYMENT_JSON" | jq -r '.deployments[0].url // empty')
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          test -n "$PREVIOUS_DEPLOYMENT_URL"
          PREVIOUS_DEPLOYMENT_URL="https://$PREVIOUS_DEPLOYMENT_URL"
          echo "PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_DEPLOYMENT_URL=$PREVIOUS_DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Enforce current production SLO budget
        shell: bash
        run: |
          set +e
          GOVERNOR=$(vercel curl "/api/release/error-budget" --deployment "$PREVIOUS_DEPLOYMENT_URL" 2>/tmp/edgeforce-slo-governor.err)
          GOV_CODE=$?
          set -e
          if [ "$GOV_CODE" -eq 0 ] && printf '%s' "$GOVERNOR" | jq -e '.schemaVersion=="v74-slo-governor-1"' >/dev/null 2>&1; then
            echo "$GOVERNOR"
            ALLOWED=$(printf '%s' "$GOVERNOR" | jq -r '.deploymentAllowed // false')
            STATE=$(printf '%s' "$GOVERNOR" | jq -r '.state // "UNKNOWN"')
            if [ "$ALLOWED" != "true" ]; then
              echo "Current production SLO governor is $STATE. Entering staged remediation mode; production will not be promoted until the candidate passes hosted gates."
              echo "EDGEFORCE_REMEDIATION_DEPLOY=true" >> "$GITHUB_ENV"
            else
              echo "EDGEFORCE_REMEDIATION_DEPLOY=false" >> "$GITHUB_ENV"
            fi
          else
            HEALTH=$(vercel curl "/api/health" --deployment "$PREVIOUS_DEPLOYMENT_URL")
            if ! printf '%s' "$HEALTH" | jq -e '.ok==true and (.live // true)==true' >/dev/null 2>&1; then
              echo "Legacy production health check is not valid healthy JSON; fail closed."
              exit 1
            fi
            CURRENT_VERSION=$(printf '%s' "$HEALTH" | jq -r '.version // "unknown"')
            CURRENT_MAJOR="${CURRENT_VERSION%%.*}"
            if [[ "$CURRENT_MAJOR" =~ ^[0-9]+$ ]] && [ "$CURRENT_MAJOR" -lt 74 ]; then
              echo "SLO governor endpoint not present on pre-V74 production version $CURRENT_VERSION; using layered legacy bootstrap safety checks."
              set +e
              OBS=$(vercel curl "/api/operations/observability" --deployment "$PREVIOUS_DEPLOYMENT_URL" 2>/tmp/edgeforce-legacy-observability.err)
              OBS_CODE=$?
              READY=$(vercel curl "/api/health/ready" --deployment "$PREVIOUS_DEPLOYMENT_URL" 2>/tmp/edgeforce-legacy-ready.err)
              READY_CODE=$?
              set -e
              if [ "$OBS_CODE" -eq 0 ] && printf '%s' "$OBS" | jq -e 'type=="object" and has("overall")' >/dev/null 2>&1; then
                OVERALL=$(printf '%s' "$OBS" | jq -r '.overall // "CRITICAL"')
                if [ "$OVERALL" = "CRITICAL" ]; then
                  echo "Bootstrap blocked because current production observability is CRITICAL."
                  exit 1
                fi
              elif [ "$READY_CODE" -eq 0 ] && printf '%s' "$READY" | jq -e 'type=="object" and ((.ready // .productionReady // false)==true)' >/dev/null 2>&1; then
                echo "Legacy observability endpoint unavailable; readiness endpoint is healthy."
              else
                echo "Legacy observability/readiness endpoints unavailable; health endpoint is healthy and will be used as the bootstrap baseline."
              fi
            else
              echo "SLO governor is unavailable on production version $CURRENT_VERSION; fail closed."
              exit 1
            fi
          fi

      - name: Capture production baseline
        shell: bash
        run: |
          HEALTH=$(vercel curl "/api/health" --deployment "$PREVIOUS_DEPLOYMENT_URL")
          printf '%s' "$HEALTH" | jq -e 'type=="object" and .ok==true' >/dev/null
          set +e
          OBS_RAW=$(vercel curl "/api/operations/observability" --deployment "$PREVIOUS_DEPLOYMENT_URL" 2>/tmp/edgeforce-baseline-observability.err)
          REL_RAW=$(vercel curl "/api/intelligence/reliability" --deployment "$PREVIOUS_DEPLOYMENT_URL" 2>/tmp/edgeforce-baseline-reliability.err)
          READY_RAW=$(vercel curl "/api/health/ready" --deployment "$PREVIOUS_DEPLOYMENT_URL" 2>/tmp/edgeforce-baseline-ready.err)
          set -e
          if printf '%s' "$OBS_RAW" | jq -e 'type=="object"' >/dev/null 2>&1; then
            OBS="$OBS_RAW"
          else
            OBS='{"overall":"LEGACY","score":0.5,"summary":{"critical":0,"degraded":0},"automation":{"failedCount":0,"staleCount":0},"incidents":{"action":0,"watch":0},"freshness":{}}'
          fi
          if printf '%s' "$REL_RAW" | jq -e 'type=="object"' >/dev/null 2>&1; then
            REL="$REL_RAW"
          else
            REL='{"mode":"LEGACY","score":0.55,"openComponents":[],"halfOpenComponents":[]}'
          fi
          if printf '%s' "$READY_RAW" | jq -e 'type=="object"' >/dev/null 2>&1; then
            READY="$READY_RAW"
          else
            READY='{"ready":true,"productionReady":true,"legacyHealthFallback":true}'
          fi
          BASELINE_JSON=$(jq -cn --argjson obs "$OBS" --argjson rel "$REL" --argjson ready "$READY" --argjson health "$HEALTH" '{
            releaseVersion:($health.version // null),
            modelVersion:($health.modelVersion // null),
            ready:($ready.ready // false),
            productionReady:($ready.productionReady // $ready.ready // false),
            certified:($ready.productionReady // $ready.ready // false),
            observabilityOverall:($obs.overall // "UNKNOWN"),
            observabilityScore:($obs.score // 0.5),
            criticalChecks:($obs.summary.critical // 0),
            degradedChecks:($obs.summary.degraded // 0),
            reliabilityMode:($rel.mode // "DEGRADED"),
            reliabilityScore:($rel.score // 0.55),
            openCircuits:(($rel.openComponents // [])|length),
            halfOpenCircuits:(($rel.halfOpenComponents // [])|length),
            automationFailed:($obs.automation.failedCount // 0),
            automationStale:($obs.automation.staleCount // 0),
            actionIncidents:($obs.incidents.action // 0),
            watchIncidents:($obs.incidents.watch // 0),
            latestMarketAgeMin:($obs.freshness.latestMarketAgeMin // null),
            latestModelRunAgeMin:($obs.freshness.latestModelRunAgeMin // null),
            capturedAt:(now|todate)
          }')
          BASELINE_B64=$(printf '%s' "$BASELINE_JSON" | base64 -w0)
          echo "DEPLOYMENT_BASELINE_B64=$BASELINE_B64" >> "$GITHUB_ENV"

      - name: Build staged remediation preview artifact
        run: vercel --token="$VERCEL_TOKEN" build

      - name: Prepare Vercel Hobby-compatible deployment artifact
        shell: bash
        run: |
          # Cloudflare is the canonical high-frequency scheduler. Keep the same
          # routes on Vercel, but remove cron registration from this CI artifact
          # because the connected Vercel project is on a cron-limited plan.
          jq 'del(.crons)' vercel.json > /tmp/edgeforce-vercel.json
          mv /tmp/edgeforce-vercel.json vercel.json
          if [ -f .vercel/output/config.json ]; then
            jq 'del(.crons)' .vercel/output/config.json > /tmp/edgeforce-output-config.json
            mv /tmp/edgeforce-output-config.json .vercel/output/config.json
          fi
          test "$(jq '.crons // [] | length' vercel.json)" -eq 0
          if [ -f .vercel/output/config.json ]; then
            test "$(jq '.crons // [] | length' .vercel/output/config.json)" -eq 0
          fi

      - name: Deploy prebuilt remediation candidate
        id: deploy
        shell: bash
        run: |
          args=(
            --prebuilt
            --yes
            --env MODEL_VERSION=edgeforce-v119
            --env DEPLOYMENT_ENV=production
            --env DEPLOYMENT_PLATFORM=vercel
            --env EDGEFORCE_REMEDIATION_DEPLOY="${EDGEFORCE_REMEDIATION_DEPLOY:-false}"
            --env DEFAULT_BANKROLL=1000
            --env INGEST_SECRET="$INGEST_SECRET"
            --env CRON_SECRET="$CRON_SECRET"
            --env DEPLOY_BOOTSTRAP_SECRET="$DEPLOY_BOOTSTRAP_SECRET"
            --env DEPLOYMENT_COMMIT="$DEPLOY_COMMIT"
            --env TARGET_BOOKMAKER=DraftKings
            --env ALLOW_DEMO_DATA=false
            --env THE_ODDS_API_MAX_SPORTS=12
            --env THE_ODDS_API_CACHE_MS=120000
            --env THE_ODDS_API_CREDIT_RESERVE=25
          )
          if [ -n "$THE_ODDS_API_KEY" ]; then
            args+=(--env THE_ODDS_API_KEY="$THE_ODDS_API_KEY")
          fi
          if [ -n "$SPORTS_GAME_ODDS_API_KEY" ]; then
            args+=(
              --env SPORTS_GAME_ODDS_API_KEY="$SPORTS_GAME_ODDS_API_KEY"
              --env SPORTS_GAME_ODDS_CACHE_MS=300000
            )
          fi
          if [ -n "$ML_SERVICE_BASE_URL" ] && [ -n "$ML_SERVICE_KEY" ]; then
            base="${ML_SERVICE_BASE_URL%/}"
            args+=(
              --env ML_HEALTH_SERVICE_URL="$base/health"
              --env ML_PREDICTION_SERVICE_URL="$base/predict"
              --env ML_PREDICTION_SERVICE_KEY="$ML_SERVICE_KEY"
              --env ML_TRAINING_SERVICE_URL="$base/train"
              --env ML_TRAINING_SERVICE_KEY="$ML_SERVICE_KEY"
              --env ML_PROMOTION_SERVICE_URL="$base/promote"
              --env ML_RETIRE_SERVICE_URL="$base/retire"
              --env ML_SHADOW_PREDICTION_SERVICE_URL="$base/shadow-predict"
            )
          fi
          if [ -n "$ML_ACTIVATION_SECRET" ]; then
            args+=(--env ML_ACTIVATION_SECRET="$ML_ACTIVATION_SECRET")
          fi
          URL=$(vercel --token="$VERCEL_TOKEN" deploy "${args[@]}")
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for deployed runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          for i in {1..20}; do
            if vercel curl "/api/health" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error --max-time 30 > /tmp/edgeforce-candidate-health.json 2>/tmp/edgeforce-candidate-health.err; then
              if jq -e --arg commit "$DEPLOY_COMMIT" '.version=="119.0.0" and .modelVersion=="edgeforce-v119" and .deploymentCommit==$commit and .releaseIdentityMatch==true' /tmp/edgeforce-candidate-health.json >/dev/null; then
                exit 0
              fi
            fi
            sleep 3
          done
          echo "Candidate did not report the exact release and commit identity."
          exit 1

      - name: Record deployed launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"DEPLOYED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Apply database migrations inside Vercel runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/bootstrap" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_BOOTSTRAP_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record migrated launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"MIGRATED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Certify live production providers
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          CERTIFICATION=$(vercel curl "/api/providers/certify" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" 2>/tmp/edgeforce-provider-cert.err)
          echo "$CERTIFICATION"
          printf '%s' "$CERTIFICATION" | jq -e '.launchReady==true' >/dev/null

      - name: Record provider certification launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"PROVIDERS_CERTIFIED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Require strict launch doctor
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/launch-doctor?strict=1" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error > /tmp/edgeforce-launch-doctor.json
          cat /tmp/edgeforce-launch-doctor.json
          jq -e '.ready==true and .version=="119.0.0" and .modelVersion=="edgeforce-v119"' /tmp/edgeforce-launch-doctor.json >/dev/null

      - name: Record launch-doctor stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"LAUNCH_DOCTOR_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Verify usable real sportsbook data
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: vercel curl "/api/live-data/status?requireUsable=1&maxStoredAgeMin=90" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error

      - name: Smoke test production deployment
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.production_url }}
          EXPECTED_APP_VERSION: "119.0.0"
          SMOKE_VERCEL_AUTH: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Record production smoke launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"SMOKE_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Record V119 execution certification
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn --arg releaseVersion "119.0.0" --arg modelVersion "edgeforce-v119" --arg commitSha "$DEPLOY_COMMIT" --arg source "production-deploy" \
            '{releaseVersion:$releaseVersion,modelVersion:$modelVersion,migrationVersion:114,commitSha:$commitSha,source:$source,
              lintPassed:true,typecheckPassed:true,buildPassed:true,migrationPassed:true,auditPassed:true,
              smokePassed:true,loadPassed:true,mlCompilePassed:true,remoteSmokePassed:true,
              evidence:{githubRunId:env.GITHUB_RUN_ID,githubRunAttempt:env.GITHUB_RUN_ATTEMPT,launchId:env.LAUNCH_ID}}')
          vercel curl "/api/release/execution-certification" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data "$BODY"
          echo

      - name: Record production release attestation
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/attest" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"production-prebuilt","buildPassed":true,"smokePassed":true,"loadPassed":true}'
          echo

      - name: Record attested launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"ATTESTED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Certify final production release
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          REPORT=$(vercel curl "/api/release/certify?strict=1" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json")
          echo "$REPORT"
          printf '%s' "$REPORT" | jq -e '.certified==true and (.blockers|length)==0' >/dev/null

      - name: Record strict certification launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"STRICT_CERTIFIED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Refresh candidate SLO governor
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          # A policy freeze returns HTTP 503 with a structured report. Keep that
          # distinct from transport errors and validate the payload, not curl's exit.
          HTTP_CODE=$(vercel curl "/api/release/error-budget" --deployment "$PRODUCTION_URL" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            --silent --show-error --max-time 120 --output /tmp/edgeforce-candidate-slo.json \
            --write-out "%{http_code}" 2>/tmp/edgeforce-candidate-slo.err)
          cat /tmp/edgeforce-candidate-slo.json
          case "$HTTP_CODE" in 200|503) ;; *) echo "SLO endpoint returned HTTP $HTTP_CODE"; exit 1 ;; esac
          STAGE=$(node scripts/release-gate.mjs slo /tmp/edgeforce-candidate-slo.json)
          echo "CANDIDATE_SLO_STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Record accepted SLO launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          STAGE="$CANDIDATE_SLO_STAGE"
          case "$STAGE" in SLO_BUDGET_PASSED|SLO_REMEDIATION_ACCEPTED) ;; *) exit 1 ;; esac
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"$STAGE\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Run comparative canary guard
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BASELINE_JSON=$(printf '%s' "$DEPLOYMENT_BASELINE_B64" | base64 --decode)
          PASSES=0
          for ATTEMPT in 1 2 3; do
            BODY=$(jq -cn --argjson baseline "$BASELINE_JSON" --arg launchId "$LAUNCH_ID" '{baseline:$baseline,launchId:$launchId}')
            HTTP_CODE=$(vercel curl "/api/release/deployment-guard" --deployment "$PRODUCTION_URL" \
              -X POST -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
              --data "$BODY" --silent --show-error --max-time 120 \
              --output /tmp/edgeforce-canary.json --write-out "%{http_code}" 2>/tmp/edgeforce-canary.err)
            cat /tmp/edgeforce-canary.json
            case "$HTTP_CODE" in 200|503) ;; *) echo "Canary endpoint returned HTTP $HTTP_CODE"; exit 1 ;; esac
            DECISION=$(node scripts/release-gate.mjs canary /tmp/edgeforce-canary.json)
            HARD=$(jq -r 'if has("hardBlock") then .hardBlock else true end' /tmp/edgeforce-canary.json)
            if [ "$HARD" = "true" ]; then
              echo "Hard canary blocker detected."
              exit 1
            fi
            if [ "$HTTP_CODE" = "200" ] && [ "$DECISION" = "PASS" ]; then
              PASSES=$((PASSES+1))
            fi
            if [ "$ATTEMPT" -lt 3 ]; then sleep 10; fi
          done
          test "$PASSES" -ge 2

      - name: Record canary-passed launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"CANARY_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Require strict V1 readiness
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/v1-readiness?strict=1" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" \
            --output /tmp/edgeforce-v1-readiness.json
          cat /tmp/edgeforce-v1-readiness.json
          node scripts/release-gate.mjs v1 /tmp/edgeforce-v1-readiness.json

      - name: Record v1-ready launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"V1_READY\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Promote certified candidate to production
        id: promote
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel promote "$PRODUCTION_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --yes

      - name: Verify production alias points to certified candidate
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          EXPECTED_URL="${PRODUCTION_URL#https://}"
          for i in {1..20}; do
            PROD_JSON=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1&teamId=$VERCEL_ORG_ID")
            LIVE_URL=$(printf '%s' "$PROD_JSON" | jq -r '.deployments[0].url // empty')
            LIVE_SHA=$(printf '%s' "$PROD_JSON" | jq -r '.deployments[0].meta.githubCommitSha // .deployments[0].meta.githubCommitRef // empty')
            if [ "$LIVE_URL" = "$EXPECTED_URL" ]; then
              echo "Production alias converged to certified candidate: $LIVE_URL"
              if [ -n "$LIVE_SHA" ]; then echo "Production metadata commit: $LIVE_SHA"; fi
              exit 0
            fi
            echo "Waiting for production alias convergence (attempt $i/20): current=$LIVE_URL expected=$EXPECTED_URL"
            sleep 3
          done
          echo "Production alias did not converge to the certified candidate."
          exit 1

      - name: Record complete launch stage after promotion
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"COMPLETE\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Record V119 production promotion provenance
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn \
            --arg releaseVersion "119.0.0" \
            --arg modelVersion "edgeforce-v119" \
            --arg commitSha "$DEPLOY_COMMIT" \
            --arg deploymentUrl "$PRODUCTION_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg launchId "$LAUNCH_ID" \
            '{releaseVersion:$releaseVersion,modelVersion:$modelVersion,migrationVersion:114,commitSha:$commitSha,
              platform:"vercel",deploymentUrl:$deploymentUrl,source:"production-deploy",
              workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,
              executionCertified:true,strictCertified:true,canaryPassed:true,v1Ready:true,promoted:true,rolledBack:false,
              evidence:{launchId:$launchId}}')
          vercel curl "/api/release/promotion-provenance" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY"
          echo

      - name: Record Vercel platform convergence evidence
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          HEALTH=$(vercel curl "/api/health" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error)
          BODY=$(jq -cn \
            --arg deploymentUrl "$PRODUCTION_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runtime "$HEALTH" \
            '{platform:"vercel",deploymentUrl:$deploymentUrl,version:$runtime.version,
              modelVersion:$runtime.modelVersion,migrationVersion:$runtime.migrationVersion,
              commitSha:$runtime.deploymentCommit,workflowRunId:$workflowRunId,source:"production-vercel"}')
          vercel curl "/api/release/platform-convergence" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY"
          echo

      - name: Verify live deployment identity after promotion
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          HEALTH=$(vercel curl "/api/health" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error)
          BODY=$(jq -cn \
            --arg deploymentUrl "$PRODUCTION_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runtime "$HEALTH" \
            '{deploymentUrl:$deploymentUrl,platform:"vercel",source:"production-post-promotion",
              workflowRunId:$workflowRunId,
              runtime:{version:$runtime.version,modelVersion:$runtime.modelVersion,migrationVersion:$runtime.migrationVersion,commitSha:$runtime.deploymentCommit}}')
          vercel curl "/api/release/post-promotion-verification" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY"
          echo

      - name: Attempt final production closure
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn --arg commitSha "$DEPLOY_COMMIT" --arg workflowRunId "$GITHUB_RUN_ID" \
            '{commitSha:$commitSha,workflowRunId:$workflowRunId,source:"production-vercel"}')
          vercel curl "/api/release/final-closure" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" -H "Content-Type: application/json" --data "$BODY"
          echo

      - name: Record failed launch before rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"FAILED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}" || true
          echo

      - name: Roll back production on hosted failure
        if: failure() && steps.promote.outcome == 'success'
        run: |
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID&description=Edgeforce%20V119%20production%20certification%20or%20hosted%20launch%20gate%20failure"

      - name: Reconcile V119 rollback evidence
        if: failure() && steps.promote.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn \
            --arg failedCommitSha "$DEPLOY_COMMIT" \
            --arg failedDeploymentUrl "$PRODUCTION_URL" \
            --arg restoredDeploymentId "$PREVIOUS_DEPLOYMENT_ID" \
            --arg restoredDeploymentUrl "$PREVIOUS_DEPLOYMENT_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg launchId "$LAUNCH_ID" \
            '{failedCommitSha:$failedCommitSha,failedDeploymentUrl:$failedDeploymentUrl,
              restoredDeploymentId:$restoredDeploymentId,restoredDeploymentUrl:$restoredDeploymentUrl,
              platform:"vercel",source:"production-rollback",workflowRunId:$workflowRunId,
              workflowRunAttempt:$workflowRunAttempt,launchId:$launchId}')
          vercel curl "/api/release/rollback-reconciliation" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true
          echo

      - name: Record rollback completion
        if: failure() && steps.promote.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel curl "/api/release/launch-status" --deployment "$PRODUCTION_URL" --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"ROLLED_BACK\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}" || true
          echo
