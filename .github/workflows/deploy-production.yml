name: Edgeforce Production Deploy

on:
  workflow_run:
    workflows: ["Verify Edgeforce"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_XlvGJkid1lgNPLVGPJn1ScEr
      VERCEL_PROJECT_ID: prj_CJokQ1ngz20Rwb7eNjk9gf3HjFHo
      VERCEL_SCOPE: tmbstartkleen-4716s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ML_SERVICE_BASE_URL: ${{ secrets.RENDER_ML_SERVICE_BASE_URL }}
      ML_SERVICE_KEY: ${{ secrets.ML_SERVICE_KEY }}
      ML_ACTIVATION_SECRET: ${{ secrets.ML_ACTIVATION_SECRET }}
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.2.0

      - name: Generate deployment-only secrets
        shell: bash
        run: |
          INGEST_SECRET=$(openssl rand -hex 32)
          CRON_SECRET=$(openssl rand -hex 32)
          DEPLOY_BOOTSTRAP_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INGEST_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$DEPLOY_BOOTSTRAP_SECRET"
          echo "INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          echo "DEPLOY_BOOTSTRAP_SECRET=$DEPLOY_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"
          LAUNCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${DEPLOY_COMMIT:0:12}"
          echo "LAUNCH_ID=$LAUNCH_ID" >> "$GITHUB_ENV"

      - name: Pull production project settings
        run: vercel --token="$VERCEL_TOKEN" pull --yes --environment=production 

      - name: Capture previous production deployment
        shell: bash
        run: |
          PREVIOUS_DEPLOYMENT_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1&teamId=$VERCEL_ORG_ID")
          PREVIOUS_DEPLOYMENT_ID=$(printf '%s' "$PREVIOUS_DEPLOYMENT_JSON" | jq -r '.deployments[0].uid // .deployments[0].id // empty')
          PREVIOUS_DEPLOYMENT_URL=$(printf '%s' "$PREVIOUS_DEPLOYMENT_JSON" | jq -r '.deployments[0].url // empty')
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          test -n "$PREVIOUS_DEPLOYMENT_URL"
          PREVIOUS_DEPLOYMENT_URL="https://$PREVIOUS_DEPLOYMENT_URL"
          echo "PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_DEPLOYMENT_URL=$PREVIOUS_DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Build exact production artifact
        run: vercel --token="$VERCEL_TOKEN" build --prod 

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          args=(
            --prebuilt
            --prod
            --yes
            
            --env MODEL_VERSION=edgeforce-v61
            --env DEFAULT_BANKROLL=1000
            --env INGEST_SECRET="$INGEST_SECRET"
            --env CRON_SECRET="$CRON_SECRET"
            --env DEPLOY_BOOTSTRAP_SECRET="$DEPLOY_BOOTSTRAP_SECRET"
            --env DEPLOYMENT_COMMIT="$DEPLOY_COMMIT"
            --env TARGET_BOOKMAKER=DraftKings
            --env ALLOW_DEMO_DATA=false
            --env THE_ODDS_API_MAX_SPORTS=12
            --env THE_ODDS_API_CACHE_MS=120000
            --env THE_ODDS_API_CREDIT_RESERVE=25
          )
          if [ -n "$THE_ODDS_API_KEY" ]; then
            args+=(--env THE_ODDS_API_KEY="$THE_ODDS_API_KEY")
          fi
          if [ -n "$ML_SERVICE_BASE_URL" ] && [ -n "$ML_SERVICE_KEY" ]; then
            base="${ML_SERVICE_BASE_URL%/}"
            args+=(
              --env ML_HEALTH_SERVICE_URL="$base/health"
              --env ML_PREDICTION_SERVICE_URL="$base/predict"
              --env ML_PREDICTION_SERVICE_KEY="$ML_SERVICE_KEY"
              --env ML_TRAINING_SERVICE_URL="$base/train"
              --env ML_TRAINING_SERVICE_KEY="$ML_SERVICE_KEY"
              --env ML_PROMOTION_SERVICE_URL="$base/promote"
              --env ML_RETIRE_SERVICE_URL="$base/retire"
              --env ML_SHADOW_PREDICTION_SERVICE_URL="$base/shadow-predict"
            )
          fi
          if [ -n "$ML_ACTIVATION_SECRET" ]; then
            args+=(--env ML_ACTIVATION_SECRET="$ML_ACTIVATION_SECRET")
          fi
          URL=$(vercel --token="$VERCEL_TOKEN" deploy "${args[@]}")
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for deployed runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          for i in {1..20}; do
            if vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/health/live" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Record deployed launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status"              -X POST             -H "Authorization: Bearer $INGEST_SECRET"             -H "Content-Type: application/json"             -d "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"DEPLOYED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Apply database migrations inside Vercel runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/bootstrap" \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_BOOTSTRAP_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record migrated launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" \
            -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"MIGRATED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Certify live production providers
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/providers/certify" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record provider certification launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"PROVIDERS_CERTIFIED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Require strict launch doctor
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/launch-doctor?strict=1" 

      - name: Record launch-doctor stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"LAUNCH_DOCTOR_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Smoke test production deployment
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.production_url }}
          EXPECTED_APP_VERSION: "61.0.0"
          SMOKE_VERCEL_AUTH: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Record production smoke launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"SMOKE_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Record production release attestation
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/attest" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"production-prebuilt","buildPassed":true,"smokePassed":true,"loadPassed":true}'
          echo

      - name: Record attested launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"ATTESTED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Certify final production release
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/certify?strict=1" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record strict certification launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"STRICT_CERTIFIED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Require V123 strict v1 readiness
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/v1-readiness?strict=1" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record v1-ready and complete launch stages
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          for STAGE in V1_READY COMPLETE; do
            vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
              -H "Authorization: Bearer $INGEST_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"$STAGE\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
            echo
          done

      - name: Record failed launch before rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"FAILED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}" || true
          echo

      - name: Roll back production on hosted failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID&description=Edgeforce%20hosted%20launch%20gate%20failure"

      - name: Record rollback completion
        if: failure() && steps.deploy.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"ROLLED_BACK\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}" || true
          echo
