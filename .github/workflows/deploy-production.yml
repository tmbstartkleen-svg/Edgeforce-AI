name: Edgeforce Production Deploy

on:
  workflow_run:
    workflows: ["Verify Edgeforce"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_XlvGJkid1lgNPLVGPJn1ScEr
      VERCEL_PROJECT_ID: prj_CJokQ1ngz20Rwb7eNjk9gf3HjFHo
      VERCEL_SCOPE: tmbstartkleen-4716s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ML_SERVICE_BASE_URL: ${{ secrets.RENDER_ML_SERVICE_BASE_URL }}
      ML_SERVICE_KEY: ${{ secrets.ML_SERVICE_KEY }}
      ML_ACTIVATION_SECRET: ${{ secrets.ML_ACTIVATION_SECRET }}
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify deployment credential
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Compile ML service
        run: python3 -m py_compile ml-service/app.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.2.0

      - name: Generate deployment-only secrets
        shell: bash
        run: |
          INGEST_SECRET=$(openssl rand -hex 32)
          CRON_SECRET=$(openssl rand -hex 32)
          DEPLOY_BOOTSTRAP_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$INGEST_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$DEPLOY_BOOTSTRAP_SECRET"
          echo "INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          echo "DEPLOY_BOOTSTRAP_SECRET=$DEPLOY_BOOTSTRAP_SECRET" >> "$GITHUB_ENV"
          LAUNCH_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${DEPLOY_COMMIT:0:12}"
          echo "LAUNCH_ID=$LAUNCH_ID" >> "$GITHUB_ENV"

      - name: Start predeploy verification server
        run: |
          MODEL_VERSION=edgeforce-v104 ENABLE_TEST_ENDPOINTS=true NEXT_TELEMETRY_DISABLED=1 npm start > /tmp/edgeforce-predeploy.log 2>&1 &
          echo $! > /tmp/edgeforce-predeploy.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/edgeforce-predeploy.log
          exit 1

      - name: Predeploy local smoke
        run: npm run smoke
        env:
          ENABLE_TEST_ENDPOINTS: "true"

      - name: Predeploy local load check
        run: npm run load-check
        env:
          LOAD_REQUESTS: "60"
          LOAD_MAX_P95_MS: "3000"

      - name: Stop predeploy verification server
        if: always()
        run: kill $(cat /tmp/edgeforce-predeploy.pid) 2>/dev/null || true

      - name: Pull production project settings
        run: vercel --token="$VERCEL_TOKEN" pull --yes --environment=production 

      - name: Capture previous production deployment
        shell: bash
        run: |
          PREVIOUS_DEPLOYMENT_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1&teamId=$VERCEL_ORG_ID")
          PREVIOUS_DEPLOYMENT_ID=$(printf '%s' "$PREVIOUS_DEPLOYMENT_JSON" | jq -r '.deployments[0].uid // .deployments[0].id // empty')
          PREVIOUS_DEPLOYMENT_URL=$(printf '%s' "$PREVIOUS_DEPLOYMENT_JSON" | jq -r '.deployments[0].url // empty')
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          test -n "$PREVIOUS_DEPLOYMENT_URL"
          PREVIOUS_DEPLOYMENT_URL="https://$PREVIOUS_DEPLOYMENT_URL"
          echo "PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_DEPLOYMENT_URL=$PREVIOUS_DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Enforce current production SLO budget
        shell: bash
        run: |
          set +e
          GOVERNOR=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/release/error-budget" 2>/tmp/edgeforce-slo-governor.err)
          GOV_CODE=$?
          set -e
          if [ "$GOV_CODE" -eq 0 ] && printf '%s' "$GOVERNOR" | jq -e '.schemaVersion=="v74-slo-governor-1"' >/dev/null 2>&1; then
            echo "$GOVERNOR"
            ALLOWED=$(printf '%s' "$GOVERNOR" | jq -r '.deploymentAllowed // false')
            STATE=$(printf '%s' "$GOVERNOR" | jq -r '.state // "UNKNOWN"')
            if [ "$ALLOWED" != "true" ]; then
              echo "Production deployment blocked by SLO governor state: $STATE"
              exit 1
            fi
          else
            HEALTH=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/health")
            CURRENT_VERSION=$(printf '%s' "$HEALTH" | jq -r '.version // "unknown"')
            if [[ "$CURRENT_VERSION" == 73.* ]]; then
              echo "SLO governor endpoint not present on V73 production; using one-time V74 bootstrap safety check."
              OBS=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/operations/observability")
              OVERALL=$(printf '%s' "$OBS" | jq -r '.overall // "CRITICAL"')
              if [ "$OVERALL" = "CRITICAL" ]; then
                echo "Bootstrap blocked because current production observability is CRITICAL."
                exit 1
              fi
            else
              echo "SLO governor is unavailable on production version $CURRENT_VERSION; fail closed."
              exit 1
            fi
          fi

      - name: Capture production baseline
        shell: bash
        run: |
          OBS=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/operations/observability")
          REL=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/intelligence/reliability")
          READY=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/health/ready")
          HEALTH=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PREVIOUS_DEPLOYMENT_URL/api/health")
          BASELINE_JSON=$(jq -cn --argjson obs "$OBS" --argjson rel "$REL" --argjson ready "$READY" --argjson health "$HEALTH" '{
            releaseVersion:($health.version // null),
            modelVersion:($health.modelVersion // null),
            ready:($ready.ready // false),
            productionReady:($ready.productionReady // $ready.ready // false),
            certified:($ready.productionReady // $ready.ready // false),
            observabilityOverall:($obs.overall // "UNKNOWN"),
            observabilityScore:($obs.score // 0.5),
            criticalChecks:($obs.summary.critical // 0),
            degradedChecks:($obs.summary.degraded // 0),
            reliabilityMode:($rel.mode // "DEGRADED"),
            reliabilityScore:($rel.score // 0.55),
            openCircuits:(($rel.openComponents // [])|length),
            halfOpenCircuits:(($rel.halfOpenComponents // [])|length),
            automationFailed:($obs.automation.failedCount // 0),
            automationStale:($obs.automation.staleCount // 0),
            actionIncidents:($obs.incidents.action // 0),
            watchIncidents:($obs.incidents.watch // 0),
            latestMarketAgeMin:($obs.freshness.latestMarketAgeMin // null),
            latestModelRunAgeMin:($obs.freshness.latestModelRunAgeMin // null),
            capturedAt:(now|todate)
          }')
          BASELINE_B64=$(printf '%s' "$BASELINE_JSON" | base64 -w0)
          echo "DEPLOYMENT_BASELINE_B64=$BASELINE_B64" >> "$GITHUB_ENV"

      - name: Build exact production artifact
        run: vercel --token="$VERCEL_TOKEN" build --prod 

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          args=(
            --prebuilt
            --prod
            --yes
            
            --env MODEL_VERSION=edgeforce-v104
            --env DEFAULT_BANKROLL=1000
            --env INGEST_SECRET="$INGEST_SECRET"
            --env CRON_SECRET="$CRON_SECRET"
            --env DEPLOY_BOOTSTRAP_SECRET="$DEPLOY_BOOTSTRAP_SECRET"
            --env DEPLOYMENT_COMMIT="$DEPLOY_COMMIT"
            --env TARGET_BOOKMAKER=DraftKings
            --env ALLOW_DEMO_DATA=false
            --env THE_ODDS_API_MAX_SPORTS=12
            --env THE_ODDS_API_CACHE_MS=120000
            --env THE_ODDS_API_CREDIT_RESERVE=25
          )
          if [ -n "$THE_ODDS_API_KEY" ]; then
            args+=(--env THE_ODDS_API_KEY="$THE_ODDS_API_KEY")
          fi
          if [ -n "$ML_SERVICE_BASE_URL" ] && [ -n "$ML_SERVICE_KEY" ]; then
            base="${ML_SERVICE_BASE_URL%/}"
            args+=(
              --env ML_HEALTH_SERVICE_URL="$base/health"
              --env ML_PREDICTION_SERVICE_URL="$base/predict"
              --env ML_PREDICTION_SERVICE_KEY="$ML_SERVICE_KEY"
              --env ML_TRAINING_SERVICE_URL="$base/train"
              --env ML_TRAINING_SERVICE_KEY="$ML_SERVICE_KEY"
              --env ML_PROMOTION_SERVICE_URL="$base/promote"
              --env ML_RETIRE_SERVICE_URL="$base/retire"
              --env ML_SHADOW_PREDICTION_SERVICE_URL="$base/shadow-predict"
            )
          fi
          if [ -n "$ML_ACTIVATION_SECRET" ]; then
            args+=(--env ML_ACTIVATION_SECRET="$ML_ACTIVATION_SECRET")
          fi
          URL=$(vercel --token="$VERCEL_TOKEN" deploy "${args[@]}")
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for deployed runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          for i in {1..20}; do
            if vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/health/live" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Record deployed launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status"              -X POST             -H "Authorization: Bearer $INGEST_SECRET"             -H "Content-Type: application/json"             -d "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"DEPLOYED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Apply database migrations inside Vercel runtime
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/bootstrap" \
            -X POST \
            -H "Authorization: Bearer $DEPLOY_BOOTSTRAP_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record migrated launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" \
            -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"MIGRATED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Certify live production providers
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/providers/certify" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record provider certification launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"PROVIDERS_CERTIFIED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Require strict launch doctor
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/launch-doctor?strict=1" 

      - name: Record launch-doctor stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"LAUNCH_DOCTOR_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Smoke test production deployment
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.production_url }}
          EXPECTED_APP_VERSION: "104.0.0"
          SMOKE_VERCEL_AUTH: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Record production smoke launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"SMOKE_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Record V104 execution certification
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn             --arg releaseVersion "104.0.0"             --arg modelVersion "edgeforce-v104"             --arg commitSha "$DEPLOY_COMMIT"             --arg source "production-deploy"             '{releaseVersion:$releaseVersion,modelVersion:$modelVersion,migrationVersion:114,commitSha:$commitSha,source:$source,
              lintPassed:true,typecheckPassed:true,buildPassed:true,migrationPassed:true,auditPassed:true,
              smokePassed:true,loadPassed:true,mlCompilePassed:true,remoteSmokePassed:true,
              evidence:{githubRunId:env.GITHUB_RUN_ID,githubRunAttempt:env.GITHUB_RUN_ATTEMPT,launchId:env.LAUNCH_ID}}')
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/execution-certification" -X POST             -H "Authorization: Bearer $INGEST_SECRET"             -H "Content-Type: application/json"             --data "$BODY"
          echo

      - name: Record production release attestation
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/attest" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"source":"production-prebuilt","buildPassed":true,"smokePassed":true,"loadPassed":true}'
          echo

      - name: Record attested launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"ATTESTED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Certify final production release
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/certify?strict=1" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record strict certification launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"STRICT_CERTIFIED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Refresh candidate SLO governor
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/error-budget" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record SLO-budget-passed launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"SLO_BUDGET_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Run comparative canary guard
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BASELINE_JSON=$(printf '%s' "$DEPLOYMENT_BASELINE_B64" | base64 --decode)
          PASSES=0
          for ATTEMPT in 1 2 3; do
            BODY=$(jq -cn --argjson baseline "$BASELINE_JSON" --arg launchId "$LAUNCH_ID" '{baseline:$baseline,launchId:$launchId}')
            set +e
            RESPONSE=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/deployment-guard"               -X POST               -H "Authorization: Bearer $INGEST_SECRET"               -H "Content-Type: application/json"               --data "$BODY" 2>&1)
            CODE=$?
            set -e
            echo "$RESPONSE"
            DECISION=$(printf '%s' "$RESPONSE" | jq -r '.decision // "BLOCK"' 2>/dev/null || echo BLOCK)
            HARD=$(printf '%s' "$RESPONSE" | jq -r '.hardBlock // true' 2>/dev/null || echo true)
            if [ "$CODE" -eq 0 ] && [ "$DECISION" = "PASS" ]; then
              PASSES=$((PASSES+1))
            fi
            if [ "$HARD" = "true" ]; then
              echo "Hard canary blocker detected."
              exit 1
            fi
            if [ "$ATTEMPT" -lt 3 ]; then sleep 10; fi
          done
          test "$PASSES" -ge 2

      - name: Record canary-passed launch stage
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"CANARY_PASSED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
          echo

      - name: Require strict V1 readiness
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/v1-readiness?strict=1" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json"
          echo

      - name: Record v1-ready and complete launch stages
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          for STAGE in V1_READY COMPLETE; do
            vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
              -H "Authorization: Bearer $INGEST_SECRET" \
              -H "Content-Type: application/json" \
              --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"$STAGE\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}"
            echo
          done

      - name: Record V104 production promotion provenance
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn \
            --arg releaseVersion "104.0.0" \
            --arg modelVersion "edgeforce-v104" \
            --arg commitSha "$DEPLOY_COMMIT" \
            --arg deploymentUrl "$PRODUCTION_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg launchId "$LAUNCH_ID" \
            '{releaseVersion:$releaseVersion,modelVersion:$modelVersion,migrationVersion:114,commitSha:$commitSha,
              platform:"vercel",deploymentUrl:$deploymentUrl,source:"production-deploy",
              workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,
              executionCertified:true,strictCertified:true,canaryPassed:true,v1Ready:true,promoted:true,rolledBack:false,
              evidence:{launchId:$launchId}}')
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/promotion-provenance" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY"
          echo

      - name: Record Vercel platform convergence evidence
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          HEALTH=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/health")
          BODY=$(jq -cn \
            --arg deploymentUrl "$PRODUCTION_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runtime "$HEALTH" \
            '{platform:"vercel",deploymentUrl:$deploymentUrl,version:$runtime.version,
              modelVersion:$runtime.modelVersion,migrationVersion:$runtime.migrationVersion,
              commitSha:$runtime.deploymentCommit,workflowRunId:$workflowRunId,source:"production-vercel"}')
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/platform-convergence" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY"
          echo

      - name: Verify live deployment identity after promotion
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          HEALTH=$(vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/health")
          BODY=$(jq -cn \
            --arg deploymentUrl "$PRODUCTION_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson runtime "$HEALTH" \
            '{deploymentUrl:$deploymentUrl,platform:"vercel",source:"production-post-promotion",
              workflowRunId:$workflowRunId,
              runtime:{version:$runtime.version,modelVersion:$runtime.modelVersion,migrationVersion:$runtime.migrationVersion,commitSha:$runtime.deploymentCommit}}')
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/post-promotion-verification" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY"
          echo

      - name: Attempt final production closure
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn --arg commitSha "$DEPLOY_COMMIT" --arg workflowRunId "$GITHUB_RUN_ID"             '{commitSha:$commitSha,workflowRunId:$workflowRunId,source:"production-vercel"}')
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/final-closure" -X POST             -H "Authorization: Bearer $INGEST_SECRET"             -H "Content-Type: application/json"             --data "$BODY"
          echo

      - name: Record failed launch before rollback
        if: failure() && steps.deploy.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"FAILED\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}" || true
          echo

      - name: Roll back production on hosted failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          test -n "$PREVIOUS_DEPLOYMENT_ID"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/rollback/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID&description=Edgeforce%20V104%20production%20certification%20or%20hosted%20launch%20gate%20failure"

      - name: Reconcile V104 rollback evidence
        if: failure() && steps.deploy.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        shell: bash
        run: |
          BODY=$(jq -cn \
            --arg failedCommitSha "$DEPLOY_COMMIT" \
            --arg failedDeploymentUrl "$PRODUCTION_URL" \
            --arg restoredDeploymentId "$PREVIOUS_DEPLOYMENT_ID" \
            --arg restoredDeploymentUrl "$PREVIOUS_DEPLOYMENT_URL" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg launchId "$LAUNCH_ID" \
            '{failedCommitSha:$failedCommitSha,failedDeploymentUrl:$failedDeploymentUrl,
              restoredDeploymentId:$restoredDeploymentId,restoredDeploymentUrl:$restoredDeploymentUrl,
              platform:"vercel",source:"production-rollback",workflowRunId:$workflowRunId,
              workflowRunAttempt:$workflowRunAttempt,launchId:$launchId}')
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/rollback-reconciliation" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true
          echo

      - name: Record rollback completion
        if: failure() && steps.deploy.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          vercel --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" curl "$PRODUCTION_URL/api/release/launch-status" -X POST \
            -H "Authorization: Bearer $INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"launchId\":\"$LAUNCH_ID\",\"stage\":\"ROLLED_BACK\",\"deploymentUrl\":\"$PRODUCTION_URL\",\"commitSha\":\"$DEPLOY_COMMIT\"}" || true
          echo
