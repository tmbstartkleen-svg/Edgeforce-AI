name: Edgeforce Hourly Ops

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  hourly-ops:
    runs-on: ubuntu-latest
    steps:
      - name: Run settlement and heartbeat
        env:
          BASE_URL: ${{ vars.EDGEFORCE_PRODUCTION_URL || 'https://edgeforce-ai2.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is required for hourly ops; EDGEFORCE_PRODUCTION_URL is optional because the canonical alias is the default."
            exit 0
          fi
          BASE_URL="${BASE_URL%/}"
          curl --fail --silent --show-error "$BASE_URL/api/cron/settle" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo
          curl --fail --silent --show-error "$BASE_URL/api/cron/heartbeat" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo
