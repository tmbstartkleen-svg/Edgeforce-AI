name: Edgeforce Release Candidate

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote validated preview to production
        required: true
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit

      - name: Validate Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@62.1.0

      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate preview environment
        run: |
          set -a
          test -f .vercel/.env.preview.local && . .vercel/.env.preview.local || true
          set +a
          MODEL_VERSION=edgeforce-v48 DEFAULT_BANKROLL="${DEFAULT_BANKROLL:-1000}" npm run validate-env
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEFAULT_BANKROLL: ${{ vars.DEFAULT_BANKROLL || '1000' }}

      - name: Build Vercel preview
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy exact prebuilt artifact
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test hosted preview
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED_APP_VERSION: "48.0.0"

      - name: Record release attestation
        run: |
          curl -fsS -X POST "${PREVIEW_URL}/api/release/attest" \
            -H "Authorization: Bearer ${INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{"source":"release-candidate","buildPassed":true,"smokePassed":true,"loadPassed":true}'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

      - name: Production promotion safety gate
        if: ${{ inputs.promote }}
        run: |
          echo "V41 disables direct preview promotion."
          echo "Use Edgeforce Production Deploy so production env validation, migrations, provider certification, hosted smoke, attestation, final certification, and rollback remain mandatory."
          exit 1
