name: Edgeforce Release Candidate

on:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Create one Vercel preview deployment after verification
        required: true
        default: false
        type: boolean
      promote:
        description: Promote the exact tested preview to production
        required: true
        default: false
        type: boolean

concurrency:
  group: edgeforce-release-candidate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-gate

  deploy:
    needs: verify
    if: ${{ inputs.deploy_preview }}
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - run: npm install
      - run: npm install --global vercel@62.1.0

      - name: Pull preview project and environment
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel env pull .env.preview.local --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate preview environment
        run: REQUIRE_PRODUCTION_ENV=true EXPECTED_MODEL_VERSION=edgeforce-v29 node --env-file=.env.preview.local scripts/validate-env.mjs

      - name: Build exact preview artifact
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy one prebuilt preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test hosted preview
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}

      - name: Require production readiness before promotion
        if: ${{ inputs.promote }}
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          REQUIRE_PRODUCTION_READY: "true"

      - name: Promote exact tested preview
        if: ${{ inputs.promote }}
        run: vercel promote "${{ steps.deploy.outputs.preview_url }}" --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
