name: Deploy Edgeforce ML Service

on:
  workflow_dispatch:
    inputs:
      run_tournament:
        description: Run the first/next ML tournament after service verification
        required: true
        default: true
        type: boolean
  workflow_run:
    workflows: ["Verify Edgeforce"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  deploy-ml:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           vars.ML_SERVICE_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_ML_SERVICE_ID }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_ML_DEPLOY_HOOK_URL }}
      ML_SERVICE_BASE_URL: ${{ secrets.RENDER_ML_SERVICE_BASE_URL }}
      ML_SERVICE_KEY: ${{ secrets.ML_SERVICE_KEY }}
      ML_ACTIVATION_SECRET: ${{ secrets.ML_ACTIVATION_SECRET }}
      EDGEFORCE_BASE_URL: ${{ secrets.EDGEFORCE_PRODUCTION_URL }}
      EXPECTED_ML_SERVICE_VERSION: edgeforce-ml-service-v61
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_XlvGJkid1lgNPLVGPJn1ScEr
      VERCEL_PROJECT_ID: prj_8edFTZzS8e6RZyMVm1mjxuGJnLPZ

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify ML deployment configuration
        shell: bash
        run: |
          test -n "$ML_SERVICE_BASE_URL"
          test -n "$ML_SERVICE_KEY"
          test -n "$ML_ACTIVATION_SECRET"
          test -n "$EDGEFORCE_BASE_URL"
          test -n "$VERCEL_TOKEN"
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            test -n "$RENDER_DEPLOY_HOOK_URL"
          fi

      - name: Trigger Render ML deploy
        id: render
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            body=$(node -e "process.stdout.write(JSON.stringify({commitId:process.env.TARGET_SHA,clearCache:'do_not_clear'}))")
            response=$(curl --fail --silent --show-error -X POST               "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"               -H "Authorization: Bearer $RENDER_API_KEY"               -H "Accept: application/json"               -H "Content-Type: application/json"               --data "$body")
            echo "$response" > /tmp/render-deploy.json
            deploy_id=$(node -e "const d=require('/tmp/render-deploy.json'); process.stdout.write(String(d.id||d.deploy?.id||''))")
            test -n "$deploy_id"
            echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
            echo "exact_commit=true" >> "$GITHUB_OUTPUT"
          else
            response=$(curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL")
            echo "$response" > /tmp/render-deploy.json
            deploy_id=$(node -e "const d=require('/tmp/render-deploy.json'); process.stdout.write(String(d.deploy?.id||''))")
            echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
            echo "exact_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for verified ML service
        shell: bash
        run: |
          set -euo pipefail
          expected=""
          if [ "${{ steps.render.outputs.exact_commit }}" = "true" ]; then
            expected="$TARGET_SHA"
          fi
          for i in {1..90}; do
            if EXPECTED_ML_COMMIT="$expected" node scripts/ml-service-doctor.mjs > /tmp/ml-doctor.json 2>/tmp/ml-doctor.err; then
              cat /tmp/ml-doctor.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/ml-doctor.err || true
          exit 1

      - name: Install pinned Vercel CLI
        if: github.event_name == 'workflow_dispatch'
        run: npm install --global vercel@62.2.0

      - name: Link Vercel production project
        if: github.event_name == 'workflow_dispatch'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Wire ML service into Vercel production environment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          base="${ML_SERVICE_BASE_URL%/}"
          set_var(){
            name="$1"
            value="$2"
            visibility="$3"
            if ! vercel env update "$name" production --value "$value" --visibility "$visibility" --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
              vercel env add "$name" production --value "$value" --visibility "$visibility" --yes --token="$VERCEL_TOKEN" >/dev/null
            fi
          }
          set_var ML_HEALTH_SERVICE_URL "$base/health" config
          set_var ML_PREDICTION_SERVICE_URL "$base/predict" config
          set_var ML_PREDICTION_SERVICE_KEY "$ML_SERVICE_KEY" secret
          set_var ML_TRAINING_SERVICE_URL "$base/train" config
          set_var ML_TRAINING_SERVICE_KEY "$ML_SERVICE_KEY" secret
          set_var ML_PROMOTION_SERVICE_URL "$base/promote" config
          set_var ML_RETIRE_SERVICE_URL "$base/retire" config
          set_var ML_ACTIVATION_SECRET "$ML_ACTIVATION_SECRET" secret

      - name: Dispatch hardened Edgeforce production deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-production.yml/dispatches"             --data '{"ref":"main"}'

      - name: Wait for Edgeforce runtime ML wiring
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if curl --fail --silent --show-error "$EDGEFORCE_BASE_URL/api/diagnostics" > /tmp/edgeforce-diagnostics.json 2>/dev/null; then
              if node -e "const d=require('/tmp/edgeforce-diagnostics.json'); process.exit(d.modelVersion==='edgeforce-v87'&&d.externalMlPredictionConfigured===true&&d.mlServiceHealthConfigured===true?0:1)"; then
                cat /tmp/edgeforce-diagnostics.json
                exit 0
              fi
            fi
            sleep 10
          done
          cat /tmp/edgeforce-diagnostics.json || true
          exit 1

      - name: Run first champion tournament
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tournament }}
        run: node scripts/ml-first-tournament-doctor.mjs | tee /tmp/ml-first-tournament.json

      - name: Verify activation without tournament
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_tournament }}
        env:
          ML_ACTIVATION_RUN_TOURNAMENT: "false"
        run: node scripts/ml-activation-doctor.mjs | tee /tmp/ml-activation.json

      - name: Record deployment attestation
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST "$EDGEFORCE_BASE_URL/api/ml/deploy-attest"             -H "Authorization: Bearer $ML_ACTIVATION_SECRET"             -H "Content-Type: application/json"             --data '{"deploymentId":"${{ steps.render.outputs.deploy_id }}"}'             | tee /tmp/ml-deploy-attestation.json

      - name: Publish ML deployment summary
        shell: bash
        run: |
          echo "## Edgeforce ML Deploy Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: $ML_SERVICE_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Render deploy: ${{ steps.render.outputs.deploy_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target commit: $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service version: $EXPECTED_ML_SERVICE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/ml-first-tournament.json ]; then
            node -e "const d=require('/tmp/ml-first-tournament.json'); console.log('- First tournament grade: '+d.grade); console.log('- Active champions: '+d.champions); console.log('- Tournament candidates: '+d.candidates); console.log('- Artifacts verified: '+d.artifactsVerified)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f /tmp/ml-activation.json ]; then
            node -e "const d=require('/tmp/ml-activation.json'); console.log('- Activation state: '+d.state); console.log('- Active champions: '+d.championsActive)" >> "$GITHUB_STEP_SUMMARY"
          fi
