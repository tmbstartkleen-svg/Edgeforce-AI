name: EdgeForce Soccer Coverage Persona
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soccer-coverage-persona.yml'
      - 'scripts/soccer-coverage-audit.mjs'
      - 'scripts/soccer-endpoint-verification.mjs'
      - 'src/lib/intelligence-core/soccer-fixture-registry.mjs'
      - 'src/lib/intelligence-core/soccer-fixture-evidence-gate.mjs'
      - 'src/lib/intelligence-core/soccer-live-board-gate.mjs'
      - 'src/lib/intelligence-core/soccer-provider-readiness.mjs'
      - 'src/lib/intelligence-core/soccer-market-identity-join.mjs'
      - 'src/lib/intelligence-core/score-source-catalog.mjs'
      - 'config/soccer-coverage-targets.json'
  workflow_dispatch:
  schedule:
    - cron: '29 */6 * * *'
permissions:
  contents: read
jobs:
  soccer-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate soccer coverage audit and endpoint parser
        run: node --test tests/soccer-coverage-audit.test.mjs tests/soccer-endpoint-verification.test.mjs tests/soccer-evidence-reconciliation.test.mjs tests/soccer-fixture-evidence-gate.test.mjs tests/soccer-live-board-gate.test.mjs tests/soccer-market-identity-join.test.mjs tests/soccer-board-identity-adapter.test.mjs tests/soccer-provider-readiness.test.mjs
      - name: Audit soccer league coverage
        run: |
          node scripts/soccer-coverage-audit.mjs soccer-coverage-report.json
          jq -r '"Tracked seed: \(.targetLeagueCount) leagues; missing: \(.missingLeagueCount). DraftKings odds verified: NO."' soccer-coverage-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Probe candidate public soccer scoreboards
        run: |
          node scripts/soccer-endpoint-verification.mjs soccer-endpoint-report.json
          jq -r '"Candidate score endpoints reachable: \(.reachable)/\(.attempted), fixture IDs observed: \(.observedFixtures), valid empty schedules: \(.reachableEmptyLeagues|length), unavailable endpoints: \(.unavailableLeagues|length). This is not verified DraftKings fixture coverage."' soccer-endpoint-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Archive auditable coverage evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-coverage-audit
          path: |
            soccer-coverage-report.json
            soccer-endpoint-report.json
          if-no-files-found: warn
          retention-days: 7
