name: Deploy Edgeforce Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit
      - run: npm install --global vercel@62.2.0
      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Validate preview release identity
        run: |
          set -a
          test -f .vercel/.env.preview.local && . .vercel/.env.preview.local || true
          set +a
          MODEL_VERSION=edgeforce-v108 DEFAULT_BANKROLL="${DEFAULT_BANKROLL:-1000}" npm run validate-env
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEFAULT_BANKROLL: ${{ vars.DEFAULT_BANKROLL || '1000' }}

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test hosted preview
        run: npm run remote-smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED_APP_VERSION: "108.0.0"
