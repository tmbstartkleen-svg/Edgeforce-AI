name: Edgeforce Vercel Budget Retry

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: edgeforce-vercel-budget-retry
  cancel-in-progress: true

jobs:
  retry-if-capacity:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_XlvGJkid1lgNPLVGPJn1ScEr
      VERCEL_PROJECT_ID: prj_CJokQ1ngz20Rwb7eNjk9gf3HjFHo
      PRODUCTION_ALIAS: edgeforce-ai.vercel.app
      VERCEL_DEPLOYMENT_BUDGET_MAX: "90"
    steps:
      - name: Check live production identity, capacity, and active release state
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          HEAD_SHA="$GITHUB_SHA"

          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/$PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" \
            --output /tmp/edgeforce-live-alias.json
          LIVE_DEPLOYMENT_ID=$(jq -r '.deploymentId // .deployment.id // empty' /tmp/edgeforce-live-alias.json)
          if ! [[ "$LIVE_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "Live production alias did not resolve to a deployment; retry remains fail-closed."
            exit 1
          fi

          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$LIVE_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" \
            --output /tmp/edgeforce-live-deployment.json
          LIVE_COMMIT=$(jq -r '.meta.edgeforceCommit // .meta.githubCommitSha // empty' /tmp/edgeforce-live-deployment.json)
          if [ "$LIVE_COMMIT" = "$HEAD_SHA" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Production already matches main at ${HEAD_SHA:0:12}; no retry needed."
            exit 0
          fi

          ACTIVE_RUNS=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?branch=main&per_page=20")
          ACTIVE_COUNT=$(printf '%s' "$ACTIVE_RUNS" | jq '[.workflow_runs[]? | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "A production workflow is already active; suppressing duplicate retry dispatch."
            exit 0
          fi

          MAX="$VERCEL_DEPLOYMENT_BUDGET_MAX"
          SINCE_MS=$(( ($(date +%s) - 86400) * 1000 ))
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?teamId=$VERCEL_ORG_ID&limit=100" \
            --output /tmp/edgeforce-vercel-deployments.json
          COUNT=$(jq --argjson since "$SINCE_MS" '[.deployments[]? | select(((.created // .createdAt // 0) | tonumber) >= $since)] | length' /tmp/edgeforce-vercel-deployments.json)
          if [ "$COUNT" -ge "$MAX" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "Vercel capacity still constrained at $COUNT / $MAX; retry remains deferred."
            exit 0
          fi

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "Vercel capacity recovered at $COUNT / $MAX and production is behind main."

      - name: Dispatch guarded production workflow
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched Edgeforce production workflow after Vercel capacity recovery."
