name: Deploy EdgeForce D1 Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/d1-standalone.ts'
      - 'worker/d1-pilot.ts'
      - 'worker/d1-gateway.ts'
      - 'worker/d1-observations.ts'
      - 'worker/d1-persistence-cert.ts'
      - 'worker/d1-workspaces.ts'
      - 'wrangler.d1-pilot.jsonc'
      - '.github/workflows/deploy-d1-pilot.yml'
permissions:
  contents: read
concurrency:
  group: edgeforce-d1-isolated-pilot
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'de9b84b39940a0b5b622ae5d27b415dc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - run: npm ci
      - name: Typecheck and validate D1 pilot
        run: |
          npm run typecheck
          node --test tests/d1-pilot.test.mjs tests/d1-observations.test.mjs tests/d1-gateway.test.mjs tests/d1-persistence-cert.test.mjs tests/d1-workspaces.test.mjs
      - name: Deploy isolated D1 Worker (no Neon or production changes)
        run: npx wrangler deploy --config wrangler.d1-pilot.jsonc
      - name: Install isolated gateway credentials
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET=$(openssl rand -hex 32)
          INGEST_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$INGEST_SECRET"
          printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET --config wrangler.d1-pilot.jsonc
          printf '%s' "$INGEST_SECRET" | npx wrangler secret put INGEST_SECRET --config wrangler.d1-pilot.jsonc
          echo "D1_PILOT_CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          echo "D1_PILOT_INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
      - name: Certify D1 readiness and reject unauthorized access
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev"
          # Cloudflare workers.dev routing may lag an otherwise successful publish.
          # Fail closed: never mistake a platform 404 or 503 for healthy D1.
          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE=$(curl -sS --connect-timeout 5 --max-time 12 -o /tmp/d1-unauthorized.json -w '%{http_code}' "$URL/api/operations/d1-pilot/readiness" || true)
            if [ "$CODE" = "401" ] && jq -e '.reason=="UNAUTHORIZED"' /tmp/d1-unauthorized.json > /dev/null 2>&1; then
              AUTH_CODE=$(curl -sS --connect-timeout 5 --max-time 12 -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/d1-authorized.json -w '%{http_code}' "$URL/api/operations/d1-pilot/readiness" || true)
              if [ "$AUTH_CODE" = "200" ] && jq -e '.ok==true and .schemaReady==true' /tmp/d1-authorized.json > /dev/null 2>&1; then
                READY=1
                break
              fi
              echo "D1 readiness attempt $ATTEMPT: authenticated HTTP $AUTH_CODE"
            else
              echo "D1 readiness attempt $ATTEMPT: unauthenticated HTTP $CODE"
            fi
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::D1 Worker route or remote DB not certified after bounded retries"
            echo "Public response excerpt:"
            head -c 400 /tmp/d1-unauthorized.json || true
            echo
            echo "Check workers.dev route activation and zone/account settings."
            exit 1
          fi
          echo "Isolated D1 pilot Worker operational: authenticated schema read succeeded, unauthorized access denied." >> "$GITHUB_STEP_SUMMARY"

      - name: Certify disabled-by-default writes
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev"
          CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 12 -o /tmp/d1-write-disabled.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $D1_PILOT_INGEST_SECRET" \
            -H "Content-Type: application/json" --data '[]' "$URL/api/operations/d1-pilot/ingest")
          test "$CODE" = 503
          jq -e '.reason=="D1_WRITE_DISABLED"' /tmp/d1-write-disabled.json > /dev/null
          echo "D1 writes explicitly disabled until approved sources and rollout certification." >> "$GITHUB_STEP_SUMMARY"
      - name: Certify limited D1 persistence round trip
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/certify-persistence"
          CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 20 -X POST \
            -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" \
            -o /tmp/d1-write-read.json -w '%{http_code}' "$URL")
          test "$CODE" = "200" || { echo "D1 persistence certification status: $CODE"; cat /tmp/d1-write-read.json; exit 1; }
          jq -e '.ok==true and .synthetic==true and .sportsObservationsVerified==false' /tmp/d1-write-read.json > /dev/null
          echo "D1 persistence read-back certified with explicit synthetic test source (not real sports ingestion)." >> "$GITHUB_STEP_SUMMARY"
      - name: Certify public read-only workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/intelligence/workspaces/summary"
          CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 15 -o /tmp/d1-public-workspaces.json -w '%{http_code}' "$URL")
          test "$CODE" = "200" || { echo "Workspace summary HTTP $CODE"; cat /tmp/d1-public-workspaces.json; exit 1; }
          jq -e '.ok==true and .actualLiveCoverageCertified==false and .predictionMarkets.nonSportsContractCount==null' /tmp/d1-public-workspaces.json > /dev/null
          echo 'Public D1 read-only workspace summary verified; no real-market coverage claimed.' >> "$GITHUB_STEP_SUMMARY"
