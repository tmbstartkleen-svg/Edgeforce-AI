name: Deploy EdgeForce D1 Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/d1-standalone.ts'
      - 'worker/d1-pilot.ts'
      - 'worker/d1-gateway.ts'
      - 'worker/d1-observations.ts'
      - 'worker/d1-persistence-cert.ts'
      - 'worker/d1-workspaces.ts'
      - 'worker/polymarket-probe.ts'
      - 'worker/d1-sports-snapshots.ts'
      - 'worker/d1-sports-ingest.ts'
      - 'worker/d1-sports-coverage.ts'
      - 'worker/d1-nfl-score-collector.ts'
      - 'worker/d1-multi-sport-collector.ts'
      - 'worker/d1-score-coverage.ts'
      - 'src/lib/intelligence-core/score-source-catalog.mjs'
      - 'src/lib/intelligence-core/d1-sports-market-store.mjs'
      - 'src/lib/intelligence-core/polymarket-source.mjs'
      - 'wrangler.d1-pilot.jsonc'
      - '.github/workflows/deploy-d1-pilot.yml'
permissions:
  contents: read
concurrency:
  group: edgeforce-d1-isolated-pilot
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'de9b84b39940a0b5b622ae5d27b415dc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - run: npm ci
      - name: Typecheck and validate D1 pilot
        run: |
          npm run typecheck
          node --test tests/d1-pilot.test.mjs tests/d1-observations.test.mjs tests/d1-gateway.test.mjs tests/d1-persistence-cert.test.mjs tests/d1-workspaces.test.mjs tests/d1-sports-snapshots.test.mjs tests/d1-sports-ingest.test.mjs tests/d1-verified-sports-coverage.test.mjs tests/d1-score-collector.test.mjs tests/d1-multi-sport-collector.test.mjs tests/d1-score-coverage.test.mjs
      - name: Deploy isolated D1 Worker (no Neon or production changes)
        run: npx wrangler deploy --config wrangler.d1-pilot.jsonc
      - name: Install isolated gateway credentials
        shell: bash
        env:
          D1_STABLE_CRON_SECRET: ${{ secrets.D1_PILOT_CRON_SECRET }}
          D1_STABLE_INGEST_SECRET: ${{ secrets.D1_PILOT_INGEST_SECRET }}
        run: |
          set -euo pipefail
          # Prefer stable secrets supplied by GitHub Actions; do not rotate them
          # on every deployment. Legacy random fallback stays isolated and masked.
          CRON_SECRET="${D1_STABLE_CRON_SECRET:-}"
          INGEST_SECRET="${D1_STABLE_INGEST_SECRET:-}"
          if [ -z "$CRON_SECRET" ]; then CRON_SECRET=$(openssl rand -hex 32); echo "::warning::D1_PILOT_CRON_SECRET not configured; rotating a temporary credential"; fi
          if [ -z "$INGEST_SECRET" ]; then INGEST_SECRET=$(openssl rand -hex 32); echo "::warning::D1_PILOT_INGEST_SECRET not configured; rotating a temporary credential"; fi
          test "${#CRON_SECRET}" -ge 32
          test "${#INGEST_SECRET}" -ge 32
          test "$CRON_SECRET" != "$INGEST_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$INGEST_SECRET"
          printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET --config wrangler.d1-pilot.jsonc
          printf '%s' "$INGEST_SECRET" | npx wrangler secret put INGEST_SECRET --config wrangler.d1-pilot.jsonc
          echo "D1_PILOT_CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          echo "D1_PILOT_INGEST_SECRET=$INGEST_SECRET" >> "$GITHUB_ENV"
      - name: Certify D1 readiness and reject unauthorized access
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev"
          # Cloudflare workers.dev routing may lag an otherwise successful publish.
          # Fail closed: never mistake a platform 404 or 503 for healthy D1.
          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE=$(curl -sS --connect-timeout 5 --max-time 12 -o /tmp/d1-unauthorized.json -w '%{http_code}' "$URL/api/operations/d1-pilot/readiness" || true)
            if [ "$CODE" = "401" ] && jq -e '.reason=="UNAUTHORIZED"' /tmp/d1-unauthorized.json > /dev/null 2>&1; then
              AUTH_CODE=$(curl -sS --connect-timeout 5 --max-time 12 -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/d1-authorized.json -w '%{http_code}' "$URL/api/operations/d1-pilot/readiness" || true)
              if [ "$AUTH_CODE" = "200" ] && jq -e '.ok==true and .schemaReady==true' /tmp/d1-authorized.json > /dev/null 2>&1; then
                READY=1
                break
              fi
              echo "D1 readiness attempt $ATTEMPT: authenticated HTTP $AUTH_CODE"
            else
              echo "D1 readiness attempt $ATTEMPT: unauthenticated HTTP $CODE"
            fi
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::D1 Worker route or remote DB not certified after bounded retries"
            echo "Public response excerpt:"
            head -c 400 /tmp/d1-unauthorized.json || true
            echo
            echo "Check workers.dev route activation and zone/account settings."
            exit 1
          fi
          echo "Isolated D1 pilot Worker operational: authenticated schema read succeeded, unauthorized access denied." >> "$GITHUB_STEP_SUMMARY"

      - name: Certify disabled-by-default writes
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev"
          CERTIFIED=0
          for ATTEMPT in $(seq 1 12); do
            CODE=$(curl -sS --connect-timeout 5 --max-time 12 -o /tmp/d1-write-disabled.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $D1_PILOT_INGEST_SECRET" \
              -H "Content-Type: application/json" --data '[]' "$URL/api/operations/d1-pilot/ingest" || true)
            if [ "$CODE" = "503" ] && jq -e '.reason=="D1_WRITE_DISABLED"' /tmp/d1-write-disabled.json > /dev/null 2>&1; then
              CERTIFIED=1
              break
            fi
            echo "D1 write-disabled propagation attempt $ATTEMPT: HTTP $CODE"
            sleep 5
          done
          if [ "$CERTIFIED" != "1" ]; then
            echo "::error::D1 write-disabled security contract did not converge."
            jq -r '.reason // .error // "UNAVAILABLE"' /tmp/d1-write-disabled.json 2>/dev/null || true
            exit 1
          fi
          echo "D1 writes explicitly disabled until approved sources and rollout certification." >> "$GITHUB_STEP_SUMMARY"
      - name: Certify limited D1 persistence round trip
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/certify-persistence"
          CERTIFIED=0
          for ATTEMPT in $(seq 1 12); do
            CODE=$(curl -sS --connect-timeout 5 --max-time 20 -X POST \
              -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" \
              -o /tmp/d1-write-read.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ] && jq -e '.ok==true and .synthetic==true and .sportsObservationsVerified==false' /tmp/d1-write-read.json >/dev/null 2>&1; then
              CERTIFIED=1
              break
            fi
            echo "D1 persistence certification attempt $ATTEMPT: HTTP $CODE"
            sleep 5
          done
          if [ "$CERTIFIED" != "1" ]; then
            echo "::error::D1 persistence readback not certified after bounded retries."
            jq -r '.reason // .error // "UNAVAILABLE"' /tmp/d1-write-read.json 2>/dev/null || true
            exit 1
          fi
          echo "D1 persistence read-back certified with explicit synthetic test source (not real sports ingestion)." >> "$GITHUB_STEP_SUMMARY"
      - name: Certify public read-only workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/intelligence/workspaces/summary"
          CODE=$(curl --silent --show-error --connect-timeout 5 --max-time 15 -o /tmp/d1-public-workspaces.json -w '%{http_code}' "$URL")
          test "$CODE" = "200" || { echo "Workspace summary HTTP $CODE"; cat /tmp/d1-public-workspaces.json; exit 1; }
          jq -e '.ok==true and .actualLiveCoverageCertified==false and .predictionMarkets.nonSportsContractCount==null' /tmp/d1-public-workspaces.json > /dev/null
          echo 'Public D1 read-only workspace summary verified; no real-market coverage claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Certify authenticated Polymarket upstream connectivity
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/polymarket-probe"
          PUBLIC_CODE=$(curl --silent --show-error --max-time 15 -o /tmp/market-probe-denied.json -w '%{http_code}' "$URL")
          test "$PUBLIC_CODE" = "401"
          jq -e '.reason=="UNAUTHORIZED"' /tmp/market-probe-denied.json > /dev/null
          AUTH_CODE=$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/market-probe.json -w '%{http_code}' "$URL")
          if [ "$AUTH_CODE" = "200" ]; then
            jq -e '.ok==true and .actualLiveUpstreamFetch==true and .persisted==false' /tmp/market-probe.json > /dev/null
            echo 'Live Polymarket public API connectivity verified (no D1 storage or sport categorization).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Polymarket upstream not reachable; source probe returned HTTP $AUTH_CODE"
            cat /tmp/market-probe.json
            echo 'Polymarket external connectivity not certified; release should not claim market coverage.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Certify authenticated D1 sports snapshot reads
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/sports-snapshots?limit=5"
          CERTIFIED=0
          for ATTEMPT in $(seq 1 12); do
            PUBLIC_CODE=$(curl -sS --max-time 15 -o /tmp/d1-sports-unauthorized.json -w '%{http_code}' "$URL" || true)
            AUTH_CODE=$(curl -sS --max-time 15 -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/d1-sports-read.json -w '%{http_code}' "$URL" || true)
            if [ "$PUBLIC_CODE" = "401" ] && jq -e '.reason=="UNAUTHORIZED"' /tmp/d1-sports-unauthorized.json >/dev/null 2>&1 &&
               [ "$AUTH_CODE" = "200" ] && jq -e '.ok==true and .kind=="SPORTS_MARKETS" and .neonHistoricalRecordsMigrated==false and (.records|type)=="array"' /tmp/d1-sports-read.json >/dev/null 2>&1; then
              CERTIFIED=1
              break
            fi
            echo "D1 sportsbook read propagation attempt $ATTEMPT: public $PUBLIC_CODE, authenticated $AUTH_CODE"
            sleep 5
          done
          if [ "$CERTIFIED" != "1" ]; then
            echo "::error::Authenticated D1 sports snapshot reads failed after bounded retries."
            jq -r '.reason // .error // "UNAVAILABLE"' /tmp/d1-sports-read.json 2>/dev/null || true
            exit 1
          fi
          echo 'Authenticated D1 sports snapshot read certified; no actual sportsbook records claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Certify sportsbook ingest remains disabled
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/sports-ingest"
          # Two secret-put operations issue separate Worker versions. Wait for the
          # fully propagated version with the newest INGEST_SECRET, not any HTTP 503.
          CERTIFIED=0
          for ATTEMPT in $(seq 1 12); do
            PUBLIC_CODE=$(curl -sS --connect-timeout 5 --max-time 12 -X POST -H "Content-Type: application/json" -d '{}' -o /tmp/sports-ingest-denied.json -w '%{http_code}' "$URL" || true)
            AUTH_CODE=$(curl -sS --connect-timeout 5 --max-time 12 -X POST -H "Authorization: Bearer $D1_PILOT_INGEST_SECRET" -H "Content-Type: application/json" -d '{}' -o /tmp/sports-ingest-disabled.json -w '%{http_code}' "$URL" || true)
            if [ "$PUBLIC_CODE" = "401" ] && jq -e '.reason=="UNAUTHORIZED"' /tmp/sports-ingest-denied.json > /dev/null 2>&1 &&
               [ "$AUTH_CODE" = "503" ] && jq -e '.reason=="D1_WRITE_DISABLED"' /tmp/sports-ingest-disabled.json > /dev/null 2>&1; then
              CERTIFIED=1
              break
            fi
            echo "Sports ingest propagation attempt $ATTEMPT: public HTTP $PUBLIC_CODE; credentialed HTTP $AUTH_CODE"
            sleep 5
          done
          if [ "$CERTIFIED" != "1" ]; then
            echo "::error::Sports ingestion deny-by-default contract failed after bounded retries."
            echo "Public response:"; jq -r '.reason // .error // "UNAVAILABLE"' /tmp/sports-ingest-denied.json 2>/dev/null || true
            echo "Credentialed response:"; jq -r '.reason // .error // "UNAVAILABLE"' /tmp/sports-ingest-disabled.json 2>/dev/null || true
            exit 1
          fi
          echo "D1 sportsbook ingestion remains disabled by default; unauthorized requests denied." >> "$GITHUB_STEP_SUMMARY"
      - name: Certify hosted D1 sports coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/sports-coverage"
          VERIFIED=0
          for ATTEMPT in $(seq 1 12); do
            PUB=$(curl -sS --max-time 15 -o /tmp/sports-coverage-denied.json -w '%{http_code}' "$URL" || true)
            AUTH=$(curl -sS --max-time 15 -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/sports-coverage.json -w '%{http_code}' "$URL" || true)
            if [ "$PUB" = "401" ] && jq -e '.reason=="UNAUTHORIZED"' /tmp/sports-coverage-denied.json >/dev/null 2>&1 &&
               [ "$AUTH" = "200" ] && jq -e '.ok==true and .store=="D1" and .productionSportsDataReady==false and .historicalNeonParityCertified==false and (.totalObservations|type)=="number"' /tmp/sports-coverage.json >/dev/null 2>&1; then
              VERIFIED=1
              break
            fi
            echo "Sports coverage certification attempt $ATTEMPT: public $PUB authenticated $AUTH"
            sleep 5
          done
          if [ "$VERIFIED" != "1" ]; then
            echo "::error::Hosted D1 sports coverage could not be certified."
            jq -r '.reason // .error // "UNAVAILABLE"' /tmp/sports-coverage.json 2>/dev/null || true
            exit 1
          fi
          echo 'D1 sports coverage evidence retrieved without claiming production readiness.' >> "$GITHUB_STEP_SUMMARY"
      - name: Certify scoreboard collector disabled
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/collect-nfl-scores"
          CODE=$(curl --silent --show-error --max-time 15 -X POST -o /tmp/score-public.json -w '%{http_code}' "$URL")
          test "$CODE" = "401"
          jq -e '.reason=="UNAUTHORIZED"' /tmp/score-public.json >/dev/null
          CODE=$(curl --silent --show-error --max-time 15 -X POST -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/score-disabled.json -w '%{http_code}' "$URL")
          test "$CODE" = "503"
          jq -e '.reason=="COLLECTION_DISABLED"' /tmp/score-disabled.json >/dev/null
          echo 'NFL source-approval collector exists but remains disabled; no requests made to ESPN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Certify multi-sport collection is disabled by default
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/collect-scores?sport=nhl"
          CODE=$(curl -sS --max-time 15 -X POST -o /tmp/collect-sports-public.json -w '%{http_code}' "$URL")
          test "$CODE" = "401"
          jq -e '.reason=="UNAUTHORIZED"' /tmp/collect-sports-public.json >/dev/null
          CODE=$(curl -sS --max-time 15 -X POST -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/collect-sports-disabled.json -w '%{http_code}' "$URL")
          test "$CODE" = "503"
          jq -e '.reason=="COLLECTION_DISABLED"' /tmp/collect-sports-disabled.json >/dev/null
          echo 'Eight-sport collection route deployed; upstream scans disabled until provider review.' >> "$GITHUB_STEP_SUMMARY"
      - name: Certify hosted score-only observation evidence
        shell: bash
        run: |
          set -euo pipefail
          URL="https://edgeforce-d1-pilot.tmbstartkleen.workers.dev/api/operations/d1-pilot/score-coverage"
          VERIFIED=0
          for ATTEMPT in $(seq 1 12); do
            PUB=$(curl -sS --max-time 12 -o /tmp/score-evidence-denied.json -w '%{http_code}' "$URL" || true)
            AUTH=$(curl -sS --max-time 12 -H "Authorization: Bearer $D1_PILOT_CRON_SECRET" -o /tmp/score-evidence.json -w '%{http_code}' "$URL" || true)
            if [ "$PUB" = "401" ] && jq -e '.reason=="UNAUTHORIZED"' /tmp/score-evidence-denied.json >/dev/null 2>&1 &&
               [ "$AUTH" = "200" ] && jq -e '.ok==true and .classification=="SCORES_NOT_ODDS" and .independentSportsbookOddsCertified==false and .automatedCollectionCertified==false' /tmp/score-evidence.json >/dev/null 2>&1; then
              VERIFIED=1
              break
            fi
            echo "Score evidence certification attempt $ATTEMPT: public $PUB authenticated $AUTH"
            sleep 5
          done
          test "$VERIFIED" = "1"
          echo 'D1 score-only observation coverage endpoint certified without falsely certifying odds or automatic collection.' >> "$GITHUB_STEP_SUMMARY"
