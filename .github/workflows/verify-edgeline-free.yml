name: Verify Edgeline free dashboard
on:
  pull_request:
    paths: ['apps/edgeline-free/**', '.github/workflows/verify-edgeline-free.yml']
  push:
    branches: [main]
    paths: ['apps/edgeline-free/**', '.github/workflows/verify-edgeline-free.yml']
permissions:
  contents: read
concurrency:
  group: edgeline-free-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  free-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/edgeline-free
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node verification/check.cjs
      - run: node verification/free.cjs
      - run: node verification/odds.cjs
      - run: node verification/players.cjs
      - run: node verification/tracker.cjs
      - run: node verification/decision.cjs
      - run: node verification/schedule.cjs
      - run: node verification/opportunities.cjs
      - run: npx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --skipLibCheck --strict worker/odds.ts worker/index.ts backend/normalize-odds.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
