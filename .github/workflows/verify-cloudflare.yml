name: Verify Edgeforce Cloudflare

on:
  pull_request:
  workflow_dispatch:

jobs:
  vinext-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Cloudflare preflight
        run: npm run preflight:cloudflare
      - name: TypeScript gate
        run: npm run typecheck
      - name: Check vinext compatibility
        run: npm run check:vinext
      - name: Build Cloudflare Worker
        shell: bash
        run: |
          set -o pipefail
          npm run build:vinext 2>&1 | tee /tmp/edgeforce-vinext-build.log
      - name: Upload Cloudflare build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeforce-v108-vinext-build-${{ github.sha }}
          path: /tmp/edgeforce-vinext-build.log
          if-no-files-found: warn
      - name: Validate generated Worker config
        run: npm run validate:cloudflare-build
