name: Verify Edgeforce Cloudflare

on:
  pull_request:
  workflow_dispatch:

jobs:
  vinext-workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check vinext compatibility
        run: npm run check:vinext
      - name: Build Cloudflare Worker
        run: npm run build:vinext
      - name: Validate generated Worker config
        run: npm run validate:cloudflare-build
