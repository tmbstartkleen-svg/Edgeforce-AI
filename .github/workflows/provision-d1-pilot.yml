name: Provision isolated EdgeForce D1 pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-isolated-d1:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create isolated pilot database only
        run: node scripts/create-isolated-d1-pilot.mjs
