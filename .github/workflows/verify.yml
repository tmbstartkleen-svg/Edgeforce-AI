name: Verify Edgeforce

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: edgeforce-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      snapshot-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-local-only
          POSTGRES_DB: edgeforce_snapshot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d edgeforce_snapshot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Compile ML service
        run: python3 -m py_compile ml-service/app.py
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify prediction persistence against PostgreSQL
        run: node --test tests/prediction-persistence.postgres.mjs
        env:
          PREDICTION_TEST_DATABASE_URL: postgres://fixture:fixture-local-only@127.0.0.1:5432/edgeforce_snapshot_test
      - name: Verify shared SharpAPI budget against PostgreSQL
        run: node --test tests/sharp-api.postgres.mjs
        env:
          SHARP_TEST_DATABASE_URL: postgres://fixture:fixture-local-only@127.0.0.1:5432/edgeforce_snapshot_test
      - run: npm run build
      - run: npm run check-migrations
      - run: npm run release-audit
      - name: Start production server
        run: |
          MODEL_VERSION=edgeforce-v119 ENABLE_TEST_ENDPOINTS=true NEXT_TELEMETRY_DISABLED=1 npm start > /tmp/edgeforce.log 2>&1 &
          echo $! > /tmp/edgeforce.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/edgeforce.log
          exit 1
      - run: npm run smoke
        env:
          ENABLE_TEST_ENDPOINTS: "true"
      - run: npm run load-check
        env:
          LOAD_REQUESTS: "60"
          LOAD_MAX_P95_MS: "3000"
      - name: Write verification evidence
        run: npm run write-execution-evidence
        env:
          EXECUTION_EVIDENCE_SOURCE: github-verify
          REMOTE_SMOKE_PASSED: "false"
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edgeforce-execution-evidence-${{ github.sha }}
          path: artifacts/release-execution-evidence.json
          if-no-files-found: error
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/edgeforce.log || true
      - name: Stop production server
        if: always()
        run: kill $(cat /tmp/edgeforce.pid) 2>/dev/null || true
