name: Prepare V119 production-target audit
on:
  push:
    branches: [v119-production-target-fidelity]
    paths: [.github/workflows/prepare-v119-target-audit.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'tmbstartkleen-svg/Edgeforce-AI' && github.ref == 'refs/heads/v119-production-target-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace three obsolete audit assertions with stricter production staging checks
        shell: bash
        run: |
          test "$(git hash-object scripts/release-audit.mjs)" = b9bad498430742aa98b384af489b3f10e7cef123
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('scripts/release-audit.mjs')
          original=p.read_text()
          lines=original.splitlines(keepends=True)
          replacements={
            "add('V114 staged Vercel remediation candidate',": "add('V119 staged production environment',read('.github/workflows/deploy-production.yml').includes('--prebuilt\\n            --prod\\n            --skip-domain')&&read('.github/workflows/deploy-production.yml').includes('Verify candidate target and unchanged production alias')&&read('.github/workflows/deploy-production.yml').includes('Promote certified candidate to production'),'production-target artifact stays unaliased until all hosted gates pass');",
            "add('V114 Vercel production alias proof',": "add('V119 actual production alias proof',read('.github/workflows/deploy-production.yml').includes('/v4/aliases/$PRODUCTION_ALIAS?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID')&&read('.github/workflows/deploy-production.yml').includes('EXPECTED_DEPLOYMENT_ID=\"$CANDIDATE_DEPLOYMENT_ID\"')&&read('.github/workflows/deploy-production.yml').includes('--deployment \"https://$PRODUCTION_ALIAS\"')&&!read('.github/workflows/deploy-production.yml').includes('target=production&state=READY&limit=1'),'live alias and runtime commit are verified instead of assuming the newest production deployment is current');",
            "add('V115 staged preview-target artifact',": "add('V119 production build fidelity',read('.github/workflows/deploy-production.yml').includes('Build staged production artifact')&&read('.github/workflows/deploy-production.yml').includes('build --prod')&&read('.github/workflows/deploy-production.yml').includes('pull --yes --environment=production')&&String(pkg.scripts.posttypecheck).includes('tests/production-target.test.mjs'),'candidate uses production settings and mandatory alias/environment regression coverage');"
          }
          for prefix,new in replacements.items():
            indices=[i for i,line in enumerate(lines) if line.startswith(prefix)]
            assert len(indices)==1, prefix
            i=indices[0]
            lines[i]=new+('\n' if lines[i].endswith('\n') else '')
          result=''.join(lines)
          assert result.count('\n')==original.count('\n')
          p.write_text(result)
          old=subprocess.check_output(['git','show','d246f439c6f90a5ca4f3350aa20544fbd2811a22:.github/workflows/deploy-production.yml'],text=True)
          current=Path('.github/workflows/deploy-production.yml').read_text()
          def step(text,name):
            marker='      - name: '+name+'\n'
            a=text.index(marker)
            b=text.find('\n      - ',a+len(marker))
            return text[a:b if b>=0 else len(text)].strip()
          for name in ['Require strict launch doctor','Smoke test production deployment','Certify final production release','Refresh candidate SLO governor','Run comparative canary guard','Require strict V1 readiness','Promote certified candidate to production','Roll back production on hosted failure']:
            assert step(old,name)==step(current,name), name+' was changed unexpectedly'
          print('Changed exactly three audit assertions; existing critical release gates are byte-identical.')
          PY
          node --check scripts/release-audit.mjs
          node --test tests/production-target.test.mjs
          npm run release-audit
          git diff --check
      - name: Commit only audited non-workflow change to this repair branch
        shell: bash
        run: |
          git add scripts/release-audit.mjs
          test "$(git diff --cached --name-only)" = scripts/release-audit.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: replace legacy preview checks with strict production staging and alias proof'
          git push origin HEAD:refs/heads/v119-production-target-fidelity
